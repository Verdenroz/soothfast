name: soothfast
description: >-
  Gate performance on pull requests and land regenerated docs as
  soothfast-bot on the default branch. Installs cargo-soothfast pinned to the
  soothfast version locked in the caller's Cargo.lock and caches it across
  runs. soothfast-measure builds into the caller's bench binary from that
  lock, so an unpinned CLI silently outruns it.
branding:
  icon: activity
  color: purple

inputs:
  version:
    description: >-
      cargo-soothfast version to install. Defaults to the soothfast version
      resolved from `lockfile`.
    required: false
    default: ""
  lockfile:
    description: Path to the Cargo.lock holding the soothfast version.
    required: false
    default: Cargo.lock
  binary:
    description: Prebuilt cargo-soothfast to run instead of installing one.
    required: false
    default: ""
  packages:
    description: >-
      Space-separated packages to gate and measure. Empty means every package
      with a bench target named soothfast.
    required: false
    default: ""
  gate:
    description: >-
      Run the gate on pull requests, and on pushes to the default branch
      gate HEAD against its parent to record the run a later pull request
      reuses as its reference. That is one extra measured gate per
      default-branch push.
    required: false
    default: "true"
  changelog:
    description: Regenerate CHANGELOG.md on pushes to the default branch.
    required: false
    default: "true"
  spec:
    description: >-
      Space-separated packages whose generate-mode specs are regenerated on
      pushes to the default branch.
    required: false
    default: ""
  baseline:
    description: Baseline name the regeneration measures into.
    required: false
    default: base
  rustdoc-toolchain:
    description: >-
      Toolchain that produces rustdoc JSON for the changelog. The default is
      the nightly the released CLI was tested against; the Makefile reads it
      from here.
    required: false
    default: nightly-2026-08-07
  token:
    description: Token for the gate comment and repository lookups.
    required: false
    default: ${{ github.token }}
  bot-token:
    description: >-
      A soothfast-bot installation token you minted yourself. Skips the
      broker.
    required: false
    default: ""
  bot-slug:
    description: App slug that `bot-token` belongs to.
    required: false
    default: soothfast-bot
  broker:
    description: Token broker URL. Empty uses the default in action/oidc.sh.
    required: false
    default: ""
  features:
    description: >-
      Cargo features passed as `--features` to the gate, the baseline
      measurement, and spec generation. A bench target with
      `required-features` needs them here.
    required: false
    default: ""
  save-baseline:
    description: >-
      Baseline name a passing pull-request gate, or the reference run of a
      default-branch push, saves its HEAD measurement under, in `.soothfast/baselines/`. A later job that needs HEAD's
      numbers (a docs claim check) can then read it instead of measuring
      again. A failing gate saves nothing, and neither does one whose bench
      binaries are identical on both sides. Empty saves nothing.
    required: false
    default: ""
  changelog-features:
    description: >-
      Features for `report changelog`, which decide what the API surface
      contains. Empty uses `features`.
    required: false
    default: ""
  changelog-packages:
    description: >-
      Space-separated packages whose API surface `report changelog` diffs.
      Empty uses `packages`; set it when crates without a bench target
      still ship an API.
    required: false
    default: ""
  regen-run:
    description: >-
      Shell run on the default branch after the built-in regeneration, for
      derived files the inputs above do not cover (an `sdk gen`, a rendered
      report). `$SOOTHFAST` names the cargo-soothfast this step installed.
      Whatever it changes under `regen-paths` lands in the same pull
      request; `regen-paths` is required with it.
    required: false
    default: ""
  regen-paths:
    description: Space-separated pathspecs `regen-run` may change.
    required: false
    default: ""
  labels:
    description: >-
      On default-branch pushes and schedules, act on the soothfast labels of
      open pull requests as soothfast-bot: `soothfast:merge` queues
      auto-merge behind the required checks, `do-not-merge` cancels it, and
      `soothfast:update` brings a pull request that fell behind up to date.
      A pull request gate labelled `soothfast:perf-accepted` reports its
      regressions without failing, whatever this is set to.
    required: false
    default: "false"
  shard:
    description: >-
      `I/N` to gate only the items shard I of N owns, for a job matrix that
      splits a large measurement. Each leg still builds both sides; only the
      measuring is split. Each shard posts its own comment. Empty gates every
      item.
    required: false
    default: ""
  comment:
    description: >-
      Post the pull request gate comment. Set "false" when a caller folds
      the gate into a comment of its own; the gate then records its result
      under `$RUNNER_TEMP/soothfast-results` for `cargo soothfast verdict
      merge`.
    required: false
    default: "true"
  cache:
    description: >-
      Restore and save the measured runs, items and link maps
      (`.soothfast/runs`, `items`, `maps`). A pull request restores the
      entry its merge-base's push recorded, so the gate measures only the
      items whose code changed. Set "false" to manage that cache yourself.
    required: false
    default: "true"

outputs:
  version:
    description: The cargo-soothfast version that was installed.
    value: ${{ steps.resolve.outputs.version }}
  cache-hit:
    description: '"true" when the binary was restored from cache.'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve cargo-soothfast
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_LOCKFILE: ${{ inputs.lockfile }}
        INPUT_BINARY: ${{ inputs.binary }}
      run: |
        if [ -n "$INPUT_BINARY" ]; then
          echo "bin=$INPUT_BINARY" >> "$GITHUB_OUTPUT"
          echo "install=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          version=$(grep -A1 '^name = "soothfast"$' "$INPUT_LOCKFILE" | grep '^version' | cut -d'"' -f2)
        fi
        if [ -z "$version" ]; then
          echo "::error::No soothfast version found in $INPUT_LOCKFILE; pass the version input"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "bin=${CARGO_HOME:-$HOME/.cargo}/bin/cargo-soothfast" >> "$GITHUB_OUTPUT"
        echo "install=true" >> "$GITHUB_OUTPUT"
    - name: Restore cargo-soothfast
      if: steps.resolve.outputs.install == 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.bin }}
        key: cargo-soothfast-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}
    - name: Install cargo-binstall
      if: steps.resolve.outputs.install == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
      with:
        tool: cargo-binstall
    - name: Install cargo-soothfast
      if: steps.resolve.outputs.install == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      # --force gets past an install record that rust-cache restores without
      # the binary itself.
      run: cargo binstall cargo-soothfast --version "$VERSION" --locked --no-confirm --force
    - name: Verify cargo-soothfast
      shell: bash
      env:
        BIN: ${{ steps.resolve.outputs.bin }}
      run: |
        if [ ! -x "$BIN" ]; then
          echo "::error::$BIN is missing or not executable after setup"
          exit 1
        fi

    - name: Prepare
      id: prepare
      shell: bash
      env:
        GATE: ${{ inputs.gate }}
        REGEN: ${{ inputs.changelog == 'true' || inputs.spec != '' || inputs.regen-run != '' }}
        PACKAGES: ${{ inputs.packages }}
        RUSTDOC_TOOLCHAIN: ${{ inputs.rustdoc-toolchain }}
        LABELS: ${{ inputs.labels }}
        CACHE: ${{ inputs.cache }}
        SHARD: ${{ inputs.shard }}
        GH_TOKEN: ${{ inputs.token }}
      run: "$GITHUB_ACTION_PATH/action/prepare.sh"
    - name: Name the runs cache
      if: steps.prepare.outputs.cache_runs == 'true'
      id: save-key
      shell: bash
      env:
        PULL: ${{ github.event_name == 'pull_request' }}
        REF_NAME: ${{ github.ref_name }}
        SHARD: ${{ inputs.shard }}
      run: |
        key="soothfast-runs-${REF_NAME}-${GITHUB_SHA}"
        if [ "$PULL" = true ] && [ -n "$SHARD" ]; then
          key="${key}-shard-${SHARD%/*}-of-${SHARD#*/}"
        fi
        echo "key=$key" >>"$GITHUB_OUTPUT"
    # The default-branch push saves under its own sha, which is the exact key
    # a later pull request asks for as its merge-base.
    - name: Restore measured runs
      if: steps.prepare.outputs.cache_runs == 'true'
      id: runs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .soothfast/runs
          .soothfast/items
          .soothfast/maps
        key: soothfast-runs-${{ steps.prepare.outputs.default_branch }}-${{ steps.prepare.outputs.reference }}
        restore-keys: |
          soothfast-runs-${{ github.ref_name }}-
          soothfast-runs-${{ steps.prepare.outputs.default_branch }}-

    - name: Gate against the base branch
      if: github.event_name == 'pull_request' && inputs.gate == 'true'
      id: gate
      shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.bin }}
        PACKAGES: ${{ steps.prepare.outputs.packages }}
        BASE_REF: ${{ github.base_ref }}
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BROKER: ${{ inputs.broker }}
        FEATURES: ${{ inputs.features }}
        SAVE_BASELINE: ${{ inputs.save-baseline }}
        SHARD: ${{ inputs.shard }}
        COMMENT: ${{ inputs.comment }}
      run: "$GITHUB_ACTION_PATH/action/gate.sh"
    - name: Upload triage artifacts
      if: steps.gate.outputs.failed == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: soothfast-triage
        path: .soothfast/triage/
        if-no-files-found: ignore
    - name: Fail on a regression
      if: steps.gate.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::soothfast gate failed; see the pull request comment and the soothfast-triage artifact"
        exit 1

    - name: Record a reference run
      if: >-
        github.event_name == 'push' && steps.prepare.outputs.on_default_branch == 'true' && inputs.gate == 'true'
        && steps.prepare.outputs.records == 'true'
      shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.bin }}
        PACKAGES: ${{ steps.prepare.outputs.packages }}
        FEATURES: ${{ inputs.features }}
        SAVE_BASELINE: ${{ inputs.save-baseline }}
      run: "$GITHUB_ACTION_PATH/action/record.sh"
    # A push saves under the plain key a pull request asks for; only the leg
    # that recorded has anything to save. A pull request's shards each save
    # their own items, for a rerun of the same shard.
    - name: Save measured runs
      if: >-
        always() && steps.prepare.outputs.cache_runs == 'true'
        && (github.event_name == 'pull_request' || steps.prepare.outputs.records == 'true')
        && steps.runs.outputs.cache-matched-key != steps.save-key.outputs.key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .soothfast/runs
          .soothfast/items
          .soothfast/maps
        key: ${{ steps.save-key.outputs.key }}

    - name: Mint a soothfast-bot token for labels
      if: steps.prepare.outputs.sweep == 'true' && inputs.bot-token == ''
      id: sweep-bot
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      run: "$GITHUB_ACTION_PATH/action/bot-token.sh"
    - name: Act on pull request labels
      if: steps.prepare.outputs.sweep == 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.bot-token || steps.sweep-bot.outputs.token }}
        DEFAULT_BRANCH: ${{ steps.prepare.outputs.default_branch }}
        REVOKE: ${{ inputs.bot-token == '' }}
      run: "$GITHUB_ACTION_PATH/action/sweep.sh"

    - name: Regenerate derived files
      if: github.event_name != 'pull_request' && steps.prepare.outputs.on_default_branch == 'true'
      id: regen
      shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.bin }}
        PACKAGES: ${{ steps.prepare.outputs.packages }}
        BASELINE: ${{ inputs.baseline }}
        CHANGELOG: ${{ inputs.changelog }}
        SPEC: ${{ inputs.spec }}
        FEATURES: ${{ inputs.features }}
        CHANGELOG_FEATURES: ${{ inputs.changelog-features }}
        CHANGELOG_PACKAGES: ${{ inputs.changelog-packages }}
        REGEN_RUN: ${{ inputs.regen-run }}
        REGEN_PATHS: ${{ inputs.regen-paths }}
      run: "$GITHUB_ACTION_PATH/action/regen.sh"
    # Minted after everything that compiles the tree has run.
    - name: Mint a soothfast-bot token
      if: steps.regen.outputs.changed == 'true' && inputs.bot-token == ''
      id: bot
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      run: "$GITHUB_ACTION_PATH/action/bot-token.sh"
    - name: Land the regenerated files
      if: steps.regen.outputs.changed == 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.bot-token || steps.bot.outputs.token }}
        APP_SLUG: ${{ steps.bot.outputs.app_slug || inputs.bot-slug }}
        BRANCH: bot/soothfast-update
        TITLE: "chore: regenerate soothfast outputs"
        BODY: Automated regeneration by soothfast.
        PATHS: ${{ steps.regen.outputs.paths }}
      run: "$GITHUB_ACTION_PATH/action/land.sh"
