<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">soothfast</title>
  <desc id="hero-desc">Measured and documented Rust: annotate code and get a gated benchmark plus living docs that fail CI the day either drifts from reality.</desc>

  <style>
    #kicker, #wordmark, #tagline {
      animation: rise .9s cubic-bezier(.16, 1, .3, 1) both;
    }
    #wordmark { animation-delay: .12s; }
    #tagline  { animation-delay: .26s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
    }

    /* Ruler graduations draw in left-to-right: a bg-colored cover slides away. */
    #tick-cover {
      transform: translateX(1210px);
      animation: sweep 1.3s cubic-bezier(.65, 0, .35, 1) .2s both;
    }
    @keyframes sweep {
      from { transform: translateX(0); }
    }

    /* Motion off: every element rests at its final, settled state. */
    @media (prefers-reduced-motion: reduce) {
      #kicker, #wordmark, #tagline, #tick-cover {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <pattern id="ticks-fine" width="24" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#93A5F2" stroke-width="1"/>
    </pattern>
    <pattern id="ticks-coarse" width="144" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#93A5F2" stroke-width="1.4"/>
    </pattern>
    <clipPath id="panel-clip">
      <rect width="1200" height="280" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="280" rx="22" fill="#14171F"/>
  <rect x=".5" y=".5" width="1199" height="279" rx="21.5" fill="none" stroke="#262B3A"/>

  <g clip-path="url(#panel-clip)">
    <g id="ruler" opacity=".38">
      <rect x="0" y="256" width="1200" height="12" fill="url(#ticks-fine)"/>
      <rect x="0" y="256" width="1200" height="12" fill="url(#ticks-coarse)"/>
    </g>
    <rect id="tick-cover" x="-10" y="254" width="1220" height="16" fill="#14171F"/>
  </g>

  <g transform="translate(64 108)" fill="#D9DEE9">
    <text id="kicker" x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="2.4" fill="#868B96">MEASURED &amp; DOCUMENTED RUST</text>

    <text id="wordmark" x="-2" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="72" font-weight="700" letter-spacing="-1.5" fill="#D9DEE9">soothfast</text>

    <text id="tagline" x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"
          font-size="19" fill="#B7BECC">Docs and numbers that stay true, or CI fails.</text>
  </g>

  <g id="project-mark" transform="translate(928 60)" stroke="#93A5F2" fill="none" opacity=".92">
    <path d="M0 160 L108 0 L216 160 Z" stroke-width="4" stroke-linejoin="round"/>
    <path d="M44 160 V131 M76 160 V110 M108 160 V131 M140 160 V110 M172 160 V131"
          stroke-width="2.8"/>
  </g>
</svg>
