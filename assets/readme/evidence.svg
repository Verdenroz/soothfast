<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="ev-title ev-desc">
  <title id="ev-title">Dogfood evidence</title>
  <desc id="ev-desc">The claims below, rendered as evidence chips: prose bound to soothfast::keep, registry fingerprinting allocates zero, and summary statistics allocate at most eight — every one gated in CI.</desc>

  <style>
    .chip { transform-box: fill-box; transform-origin: 50% 50%; }
    #chip1 { animation: stamp .55s cubic-bezier(.16, 1, .3, 1) .25s both; }
    #chip2 { animation: stamp .55s cubic-bezier(.16, 1, .3, 1) .55s both; }
    #chip3 { animation: stamp .55s cubic-bezier(.16, 1, .3, 1) .85s both; }
    @keyframes stamp {
      from { opacity: 0; transform: scale(1.14); }
    }

    .check { stroke-dasharray: 20; }
    #check2 { animation: draw .4s ease-out .95s both; }
    #check3 { animation: draw .4s ease-out 1.25s both; }
    @keyframes draw {
      from { stroke-dashoffset: 20; }
    }

    @media (prefers-reduced-motion: reduce) {
      .chip, .check { animation: none !important; }
    }
  </style>

  <rect width="1200" height="120" rx="18" fill="#14171F"/>
  <rect x=".5" y=".5" width="1199" height="119" rx="17.5" fill="none" stroke="#262B3A"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="28" y="36" font-size="11" letter-spacing="2.2" fill="#7D8496">DOGFOOD &#183; CHECKED ON EVERY CI RUN</text>
    <text x="1172" y="36" text-anchor="end" font-size="11" fill="#565D6E">cargo soothfast docs check</text>

    <g id="chip1" class="chip">
      <rect x="28" y="59" width="188" height="34" rx="17" fill="#232A42" stroke="#46527D"/>
      <text x="122" y="81" text-anchor="middle" font-size="12.5" fill="#93A5F2">bind soothfast::keep</text>
    </g>

    <g id="chip2" class="chip">
      <rect x="244" y="59" width="424" height="34" rx="17" fill="#17301F" stroke="#33613F"/>
      <path id="check2" class="check" d="M262 76 l4.5 4.5 l8 -9.5" fill="none" stroke="#57C97C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="286" y="81" font-size="12.5" fill="#57C97C">soothfast_registry::bench_fnv1a.alloc.allocs &#8804; 0</text>
    </g>

    <g id="chip3" class="chip">
      <rect x="696" y="59" width="448" height="34" rx="17" fill="#17301F" stroke="#33613F"/>
      <path id="check3" class="check" d="M714 76 l4.5 4.5 l8 -9.5" fill="none" stroke="#57C97C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="738" y="81" font-size="12.5" fill="#57C97C">soothfast_measure::bench_summarize.alloc.allocs &#8804; 8</text>
    </g>
  </g>
</svg>
