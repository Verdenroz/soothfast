# Code generated by `cargo soothfast bind gen`. DO NOT EDIT.

[package]
name = "io_soothfast_statskt-jni"
version = "0.3.2"
edition = "2024"
publish = false

# Built on its own by the packaging tool, never as a member of whatever
# workspace it is generated inside.
[workspace]

[lib]
name = "io_soothfast_statskt"
crate-type = ["cdylib"]

[dependencies]
soothfast-demo = { path = "../.." }
jni = "0.21"

# Built once and shipped, so build time is worth trading for speed.
# Unwinding past an `extern "system"` boundary is undefined, so a panic
# aborts instead.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
