# Code generated by `cargo soothfast bind gen`. DO NOT EDIT.

[package]
name = "soothfast-stats-js"
version = "0.1.15"
edition = "2024"
publish = false

# Built on its own by the packaging tool, never as a member of whatever
# workspace it is generated inside.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soothfast-demo = { path = "../.." }
wasm-bindgen = "0.2"

# Built once and shipped, so build time is worth trading for a smaller,
# faster artifact. wasm32 has no unwinding, so aborting costs nothing.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
