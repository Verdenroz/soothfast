# Site configuration for `cargo soothfast docs build`/`docs serve`.
# Generated pages (reference/, perf/, coverage.md) are produced by
# `make docs-pages` before the build — the site can only reflect the current code.

[site]
name = "soothfast"
version = "0.5.2"
repo = "https://github.com/Verdenroz/soothfast"

[[site.nav]]
title = "Guide"
pages = ["index.md", "measuring.md", "gating.md", "importing.md", "testing.md", "ci.md", "living-docs.md", "spec.md", "sdk.md", "reports.md", "interchange.md"]

[[site.nav]]
title = "API reference"
pages = [
  "reference/soothfast.md",
  "reference/soothfast-macros.md",
  "reference/soothfast-registry.md",
  "reference/soothfast-measure.md",
  "reference/soothfast-docs.md",
  "reference/soothfast-spec.md",
  "reference/soothfast-sdk.md",
  "reference/soothfast-site.md",
  "reference/soothfast-report.md",
]

[[site.nav]]
title = "Performance"
pages = ["perf/summary.md", "coverage.md"]

# No Rust test reads these; anything else outside a package selects every package.
[test]
ignore = ["*.md", "docs/**", "llms.txt", "LICENSE", ".github/**", "action/**", "action.yml", "assets/**", "bot/**"]
