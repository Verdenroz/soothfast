name: install-cargo-soothfast
description: >-
  Install the cargo-soothfast that matches the ref the reusable run workflow
  was called at: the crates.io release when that ref is the commit of a
  published release tag, else a build of the ref itself. Expects the
  workflow's repository checked out at that ref in `.soothfast-action`.
outputs:
  bin:
    description: Path of the installed cargo-soothfast.
    value: ${{ steps.resolve.outputs.bin }}

runs:
  using: composite
  steps:
    - name: Resolve cargo-soothfast
      id: resolve
      shell: bash
      run: |
        source="$GITHUB_WORKSPACE/.soothfast-action"
        rev=$(git -C "$source" rev-parse HEAD)
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$source/Cargo.toml" | head -n 1)
        tag_rev=$(git ls-remote https://github.com/Verdenroz/soothfast "refs/tags/v$version" "refs/tags/v$version^{}" | awk 'END { print $1 }')
        released=false
        if [ "$tag_rev" = "$rev" ] && curl -fsS -A soothfast-ci -o /dev/null "https://crates.io/api/v1/crates/cargo-soothfast/$version"; then
          released=true
        fi
        {
          echo "version=$version"
          echo "rev=$rev"
          echo "released=$released"
          echo "bin=${CARGO_HOME:-$HOME/.cargo}/bin/cargo-soothfast"
        } >> "$GITHUB_OUTPUT"
    - name: Install the release
      if: steps.resolve.outputs.released == 'true'
      uses: ./.soothfast-action
      with:
        version: ${{ steps.resolve.outputs.version }}
        gate: "false"
        changelog: "false"
    - name: Restore the build of this ref
      if: steps.resolve.outputs.released != 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.bin }}
        key: cargo-soothfast-git-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.rev }}
    - name: Build this ref
      if: steps.resolve.outputs.released != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        REV: ${{ steps.resolve.outputs.rev }}
      run: cargo install --locked --git https://github.com/Verdenroz/soothfast --rev "$REV" cargo-soothfast
