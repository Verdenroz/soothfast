name: soothfast-check
description: >-
  Run one check job of the reusable run workflow: the toolchain and caches,
  `cargo soothfast ci` for the check's kind, the spec builds staged for the
  jobs that read them, and the result upload. Expects the workflow's
  repository checked out at its ref in `.soothfast-action`, and the caller's
  own checkout in the workspace.
inputs:
  kind:
    description: The check kind, which names the rust-cache entry.
    required: true
  package:
    description: The package the check covers; empty for a kind that has none.
    required: false
    default: ""
  name:
    description: The check's record name, which names its caches and artifacts.
    required: true
  rustdoc:
    description: Whether the check reads rustdoc JSON, so needs the pinned nightly.
    required: false
    default: "false"
  stage:
    description: Whether to stage and upload the spec builds.
    required: false
    default: "false"
  regen:
    description: Whether the run may regenerate files, which the checks then report instead of failing on.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: check-${{ inputs.kind }}
    - uses: ./.soothfast-action/action/install
    - name: Install the pinned rustdoc toolchain
      if: inputs.rustdoc == 'true'
      shell: bash
      run: ./.soothfast-action/action/rustdoc-toolchain.sh
    # Entries are named for the toolchain, flags and sources they came from,
    # so a restored store only saves the builds whose inputs did not change.
    - name: Restore and save the rustdoc and executable stores
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .soothfast/rustdoc
          .soothfast/bins
        key: soothfast-check-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          soothfast-check-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
          soothfast-check-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.ref || github.ref_name }}-
          soothfast-check-${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-
    - name: Check
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        PACKAGE: ${{ inputs.package }}
        SOOTHFAST_REGEN: ${{ inputs.regen == 'true' && 'true' || '' }}
      run: cargo soothfast ci "$KIND" ${PACKAGE:+-p "$PACKAGE"}
    # Both lanes are store hits after the check, so this only copies what
    # the site's routes pages and the regeneration read.
    - name: Stage the spec builds
      if: ${{ !cancelled() && inputs.kind == 'spec' && inputs.stage == 'true' }}
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        STAGE: ${{ runner.temp }}/store
      run: |
        for lane in routes rustdoc; do
          cargo soothfast ci build "$lane" --stage "$STAGE" ${PACKAGE:+--spec "$PACKAGE"} \
            || echo "::warning::could not stage the $lane builds"
        done
        if [ -d "$STAGE" ]; then tar -C "$STAGE" -cf "$RUNNER_TEMP/store.tar" .; fi
    # Only the staging step writes the tar, so nothing uploads without it.
    - name: Upload the spec builds
      if: ${{ !cancelled() && inputs.kind == 'spec' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: soothfast-store-${{ inputs.name }}
        path: ${{ runner.temp }}/store.tar
        if-no-files-found: ignore
        retention-days: 1
        compression-level: 1
    - name: Upload the check result
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: soothfast-result-${{ inputs.name }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/soothfast-results
        if-no-files-found: ignore
