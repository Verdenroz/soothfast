name: soothfast-check
description: >-
  Run one check job of the reusable run workflow: the toolchain and caches,
  `cargo soothfast ci checks` over the entry's checks, the spec builds staged
  for the jobs that read them, and the result upload. Expects the workflow's
  repository checked out at its ref in `.soothfast-action`, and the caller's
  own checkout in the workspace.
inputs:
  slug:
    description: The entry's name, which names its caches and artifacts.
    required: true
  runs:
    description: The `KIND[:PACKAGE]` tokens `ci checks` runs, separated by spaces.
    required: true
  spec:
    description: The spec packages whose builds to stage, separated by spaces.
    required: false
    default: ""
  legacy:
    description: The slug of the job a grouped entry replaced, whose cache it starts from when its own is empty.
    required: false
    default: ""
  rustdoc:
    description: Whether a check reads rustdoc JSON, so needs the pinned nightly.
    required: false
    default: "false"
  stage:
    description: Whether to stage and upload the spec builds.
    required: false
    default: "false"
  regen:
    description: Whether the run may regenerate files, which the checks then report instead of failing on.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: check-${{ inputs.slug }}
        save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    - uses: ./.soothfast-action/action/install
    - name: Install the pinned rustdoc toolchain
      if: inputs.rustdoc == 'true'
      shell: bash
      run: ./.soothfast-action/action/rustdoc-toolchain.sh
    # Entries are named for the toolchain, flags and sources they came from,
    # so a restored store only saves the builds whose inputs did not change.
    - name: Restore and save the rustdoc and executable stores
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .soothfast/rustdoc
          .soothfast/bins
        key: soothfast-check-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          soothfast-check-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
          soothfast-check-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.ref || github.ref_name }}-
          soothfast-check-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-
          soothfast-check-${{ inputs.legacy || inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.ref || github.ref_name }}-
          soothfast-check-${{ inputs.legacy || inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-
    - name: Check
      shell: bash
      env:
        RUNS: ${{ inputs.runs }}
        SOOTHFAST_REGEN: ${{ inputs.regen == 'true' && 'true' || '' }}
      run: cargo soothfast ci checks $RUNS
    - id: target
      name: Check the target is not empty
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      shell: bash
      run: ./.soothfast-action/action/clear-stores-if-no-target.sh
    - name: Check again with the stores cleared
      if: steps.target.outputs.empty == 'true'
      continue-on-error: true
      shell: bash
      env:
        RUNS: ${{ inputs.runs }}
        SOOTHFAST_REGEN: ${{ inputs.regen == 'true' && 'true' || '' }}
      run: cargo soothfast ci checks $RUNS
    # Both lanes are store hits after the check, so this only copies what
    # the site's routes pages and the regeneration read.
    - name: Stage the spec builds
      if: ${{ !cancelled() && inputs.spec != '' && inputs.stage == 'true' }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        STAGE: ${{ runner.temp }}/store
      run: |
        packages=()
        for package in $SPEC; do packages+=(--spec "$package"); done
        for lane in routes rustdoc; do
          cargo soothfast ci build "$lane" --stage "$STAGE" "${packages[@]}" \
            || echo "::warning::could not stage the $lane builds"
        done
        if [ -d "$STAGE" ]; then tar -C "$STAGE" -cf "$RUNNER_TEMP/store.tar" .; fi
    # Only the staging step writes the tar, so nothing uploads without it.
    - name: Upload the spec builds
      if: ${{ !cancelled() && inputs.spec != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: soothfast-store-${{ inputs.slug }}
        path: ${{ runner.temp }}/store.tar
        if-no-files-found: ignore
        retention-days: 1
        compression-level: 1
    - name: Upload the check result
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: soothfast-result-${{ inputs.slug }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/soothfast-results
        if-no-files-found: ignore
