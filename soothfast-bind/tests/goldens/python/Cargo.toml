# Code generated by `cargo soothfast bind gen`. DO NOT EDIT.

[package]
name = "acme-core-glue"
version = "0.1.0"
edition = "2024"
publish = false

# Built on its own by the packaging tool, never as a member of whatever
# workspace it is generated inside.
[workspace]

[lib]
name = "acme_core"
crate-type = ["cdylib"]

[dependencies]
acme = { path = ".." }
pyo3 = { version = "0.26", features = ["extension-module", "experimental-async"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Built once and shipped, so build time is worth trading for speed.
# `panic = "abort"` is deliberately absent: pyo3 turns a panic into a Python
# exception through `catch_unwind`, which aborting would kill the interpreter
# instead.
[profile.release]
lto = true
codegen-units = 1
