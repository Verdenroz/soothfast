# Code generated by `cargo soothfast bind gen`. DO NOT EDIT.

[package]
name = "acme-core"
version = "0.1.0"
edition = "2024"
publish = false

# Built on its own by the packaging tool, never as a member of whatever
# workspace it is generated inside.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
acme = { path = ".." }
# napi6 is what `BigInt` and the 64-bit typed arrays need; every Node
# release still supported carries it.
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

# Built once and shipped, so build time is worth trading for a smaller,
# faster artifact.
[profile.release]
lto = true
strip = "symbols"
