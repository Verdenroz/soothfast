version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "master"
    # Wait before adopting brand-new releases (dodges the compromised-republish window).
    cooldown:
      default-days: 7
    assignees:
      - "Verdenroz"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 7
    assignees:
      - "Verdenroz"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "ci"
