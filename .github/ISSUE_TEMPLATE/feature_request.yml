name: Feature request
description: Suggest an enhancement or new capability for soothfast.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For large changes (new metric backends, new spec providers, new public API surface) it helps to open this issue for discussion before writing code, so effort isn't wasted if the direction doesn't fit the project.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that soothfast doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Mention any alternatives you considered.
    validations:
      required: true

  - type: dropdown
    id: crates
    attributes:
      label: Affected crate(s)
      multiple: true
      options:
        - soothfast
        - soothfast-macros
        - soothfast-registry
        - soothfast-measure
        - soothfast-docs
        - soothfast-spec
        - soothfast-sdk
        - soothfast-report
        - soothfast-site
        - cargo-soothfast
        - not sure / new crate
    validations:
      required: false

  - type: dropdown
    id: willing
    attributes:
      label: Are you willing to implement this?
      description: Helps with prioritization — not a commitment.
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true
