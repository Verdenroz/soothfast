name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions: {}

jobs:
  check:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  msrv:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv
      - run: cargo check --workspace --all-targets --all-features

  # Dogfood: measure the self-bench crates, then gate every bind, claim, and
  # captured output against this build's own run.
  docs:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make baselines
      - run: cargo run --release -p cargo-soothfast -- docs check -p soothfast --baseline self README.md docs/index.md
      - run: cargo run --release -p cargo-soothfast -- docs capture -p soothfast --check README.md docs/index.md
      - run: cargo run --release -p cargo-soothfast -- docs check -p soothfast-measure --baseline self docs/measuring.md docs/gating.md
      - run: cargo run --release -p cargo-soothfast -- docs capture -p soothfast-measure --check docs/measuring.md docs/gating.md
      - run: cargo run --release -p cargo-soothfast -- docs check -p soothfast-docs --baseline self docs/living-docs.md
      - run: cargo run --release -p cargo-soothfast -- docs check -p soothfast-spec --baseline self docs/spec.md
      - run: cargo run --release -p cargo-soothfast -- docs capture -p soothfast-spec --check docs/spec.md
      - run: cargo run --release -p cargo-soothfast -- docs check -p soothfast-report --baseline self docs/reports.md
      - run: cargo run --release -p cargo-soothfast -- docs capture -p soothfast-report --check docs/reports.md
      - run: make llms-gate

  # Dogfood: gate each self-bench crate's perf against the PR's merge-base.
  # Keep this package list in sync with Makefile's BENCH_CRATES.
  gate:
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    strategy:
      matrix:
        package:
          [
            soothfast-registry,
            soothfast-measure,
            soothfast-docs,
            soothfast-spec,
            soothfast-sdk,
            soothfast-site,
            soothfast-report,
          ]
    permissions:
      contents: read
    uses: ./.github/workflows/soothfast-gate.yml
    with:
      package: ${{ matrix.package }}
    secrets:
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

  # Regenerate and publish the site only on merge to master: fresh
  # measurements, fresh pages, gh-deploy.
  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Mint a soothfast-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain from the Makefile
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make baselines
      - run: make docs-pages
      - run: cargo run --release -p cargo-soothfast -- docs build --baseline self
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          publish_dir: ./site
