name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions: {}

jobs:
  check:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  msrv:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
      - run: cargo check --workspace --all-targets --all-features

  # Compile cargo-soothfast once and share it as an artifact: docs,
  # docs-regen, the gate matrix, and deploy-docs would otherwise each
  # rebuild it from source in release mode.
  build-cli:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p cargo-soothfast
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-soothfast-bin
          path: target/release/cargo-soothfast
          retention-days: 1

  # Dogfood: measure the self-bench crates, then gate every bind, claim, and
  # captured output against this build's own run.
  docs:
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (a private repo needs it)
    env:
      SOOTHFAST: ./bin/cargo-soothfast
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-soothfast-bin
          path: bin
      - run: chmod +x bin/cargo-soothfast
      - run: make baselines
      - run: bin/cargo-soothfast docs check -p soothfast --baseline self README.md docs/index.md
      - run: bin/cargo-soothfast docs check -p soothfast-measure --baseline self docs/measuring.md docs/gating.md
      - run: bin/cargo-soothfast docs check -p soothfast-docs --baseline self docs/living-docs.md
      - run: bin/cargo-soothfast docs check -p soothfast-spec --baseline self docs/spec.md
      - run: bin/cargo-soothfast docs check -p soothfast-sdk --baseline self docs/sdk.md
      - run: bin/cargo-soothfast docs check -p soothfast-report --baseline self docs/reports.md
      - name: Public API doc coverage must stay complete
        run: |
          for crate in soothfast soothfast-macros soothfast-registry soothfast-measure \
                       soothfast-docs soothfast-spec soothfast-sdk soothfast-report soothfast-site; do
            bin/cargo-soothfast coverage docs -p "$crate" --min 100
          done

  # Regenerate every derivable docs artifact on the default branch and commit
  # the result. Mirrors the spec workflow: a contributor never has to
  # remember to run capture or docs-pages by hand.
  docs-regen:
    if: github.event_name == 'push'
    needs: [build-cli]
    runs-on: ubuntu-latest
    concurrency:
      group: docs-regen
      cancel-in-progress: true
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write # soothfast-bot token via the broker, see bot/
    env:
      SOOTHFAST: ./bin/cargo-soothfast
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-soothfast-bin
          path: bin
      - run: chmod +x bin/cargo-soothfast
      - run: make baselines
      - name: Regenerate captured doc output and reference pages
        run: |
          bin/cargo-soothfast docs capture -p soothfast README.md docs/index.md
          bin/cargo-soothfast docs capture -p soothfast-measure docs/measuring.md docs/gating.md
          bin/cargo-soothfast docs capture -p soothfast-spec docs/spec.md
          bin/cargo-soothfast docs capture -p soothfast-report docs/reports.md
          make docs-pages
      - name: Keep llms.txt only when the documented surface moved
        # Measured lines change every run; committing them would make this
        # job re-trigger itself off its own merges forever
        run: |
          if git diff --quiet -- llms.txt; then exit 0; fi
          mkdir -p target/llms-churn
          sed '/^\*\*Measured:\*\*/d' llms.txt > target/llms-churn/new.txt
          git show HEAD:llms.txt | sed '/^\*\*Measured:\*\*/d' > target/llms-churn/old.txt
          cmp -s target/llms-churn/old.txt target/llms-churn/new.txt && git checkout -- llms.txt || true
      - name: Mint a soothfast-bot token
        id: bot
        run: action/bot-token.sh
      - name: Land the regenerated docs
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          BRANCH: bot/docs-update
          TITLE: "docs: regenerate derived docs"
          BODY: Automated regeneration of captured output and reference pages.
          PATHS: llms.txt README.md docs
        run: action/land.sh

  # Dogfood: gate each self-bench crate's perf against the PR's merge-base.
  # Keep this package list in sync with Makefile's BENCH_CRATES.
  gate:
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    needs: [build-cli]
    strategy:
      matrix:
        package:
          [
            soothfast-registry,
            soothfast-measure,
            soothfast-docs,
            soothfast-spec,
            soothfast-sdk,
            soothfast-site,
            soothfast-report,
          ]
    permissions:
      contents: read
      pull-requests: write # gate comment fallback
      id-token: write # soothfast-bot comment token via the broker
    uses: ./.github/workflows/soothfast-gate.yml
    with:
      package: ${{ matrix.package }}
      cli-artifact: cargo-soothfast-bin

  # One stable context for branch protection; the per-crate gate legs
  # change names whenever the crate list does.
  ci-ok:
    name: CI ok
    if: always() && github.event_name == 'pull_request'
    needs: [check, msrv, docs, gate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Verify needed jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$RESULTS"

  # Regenerate and publish the site only on merge to master: fresh
  # measurements, fresh pages, gh-deploy.
  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, docs, build-cli]
    runs-on: ubuntu-latest
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write # soothfast-bot token pushes the built site to gh-pages
    env:
      SOOTHFAST: ./bin/cargo-soothfast
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain from the Makefile
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-soothfast-bin
          path: bin
      - run: chmod +x bin/cargo-soothfast
      - run: make baselines
      - run: make docs-pages
      - run: bin/cargo-soothfast docs build --baseline self
      - name: Mint a soothfast-bot token
        id: bot
        run: action/bot-token.sh
      # The Pages action authors the commit as the actor unless told otherwise.
      - name: Resolve the bot's commit identity
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
        run: |
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.bot.outputs.token }}
          publish_dir: ./site
          user_name: ${{ steps.bot-user.outputs.name }}
          user_email: ${{ steps.bot-user.outputs.email }}
      - name: Revoke the soothfast-bot token
        if: always() && steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api -X DELETE /installation/token
