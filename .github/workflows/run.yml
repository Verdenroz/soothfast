name: soothfast-run

# The one workflow a repo calls. `cargo soothfast plan` reads the repo's
# soothfast.toml and says which jobs run; `cargo soothfast init` writes the
# caller.
on:
  workflow_call:
    inputs:
      soothfast_ref:
        description: "Commit, tag or branch of this repository the caller pins; the caller writes it"
        required: true
        type: string
      bot:
        description: "Land regenerated files and act on labels as soothfast-bot"
        required: false
        type: boolean
        default: false
      runs_on:
        description: "JSON runner labels for the plan job; the soothfast.toml [ci] table decides the rest"
        required: false
        type: string
        default: '"ubuntu-latest"'
      java:
        description: "Java version for Gradle and Maven projects"
        required: false
        type: string
        default: "21"
      node:
        description: "Node version for Node projects"
        required: false
        type: string
        default: "22"
      shard:
        description: "Legs the Rust gate is split into; each builds nothing and measures its share of the items"
        required: false
        type: number
        default: 1

permissions: {}

# Cargo colours its stderr even when piped, and the codes land in the verdict.
env:
  CARGO_TERM_COLOR: never

# Steps default to bash without pipefail otherwise, and a `| tee` would hide
# the failing command's exit status.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      projects: ${{ steps.plan.outputs.projects }}
      rust: ${{ steps.plan.outputs.rust }}
      test: ${{ steps.plan.outputs.test }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
      packages: ${{ steps.plan.outputs.packages }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_package: ${{ steps.plan.outputs.docs_package }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_projects: ${{ steps.plan.outputs.test_projects }}
      test_all: ${{ steps.plan.outputs.test_all }}
      test_expect: ${{ steps.plan.outputs.test_expect }}
      build_bench: ${{ steps.plan.outputs.build_bench }}
      build_rustdoc: ${{ steps.plan.outputs.build_rustdoc }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # An empty ref would check out the default branch, which may predate this workflow.
      - name: Require the soothfast ref
        env:
          SOOTHFAST_REF: ${{ inputs.soothfast_ref }}
        run: |
          if [ -z "$SOOTHFAST_REF" ]; then
            echo "::error::soothfast_ref is empty; run cargo soothfast init to rewrite the caller"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action scripts at this workflow's own commit, whoever calls it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - name: Labels a writer applied
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .soothfast-action/action/writer-labels.sh
      # Stored passes are looked up here, before any job or toolchain exists,
      # so a test a pass covers costs no runner at all.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soothfast-tests-${{ github.ref_name }}-
            soothfast-tests-${{ github.event.repository.default_branch }}-
      - name: Plan
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.labels }}
          JAVA: ${{ inputs.java }}
          NODE: ${{ inputs.node }}
          SHARD: ${{ inputs.shard }}
          # A push records every item in its first leg; the others would only set up.
          FIRST_ONLY: ${{ github.event_name != 'pull_request' && 'true' || '' }}
          SETTLED: ${{ runner.temp }}/settled
        run: |
          cargo soothfast plan --github --java "$JAVA" --node "$NODE" \
            --shard "$SHARD" ${FIRST_ONLY:+--first-shard-only} \
            --results "$SETTLED" \
            ${BASE_REF:+--base "origin/$BASE_REF"} ${LABELS:+--labels "$LABELS"} >> "$GITHUB_OUTPUT"
      - name: Upload the results of tests that need no job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-settled
          path: ${{ runner.temp }}/settled
          if-no-files-found: ignore

  # Compiles what the gate and the docs check read into the executable and
  # rustdoc stores, on separate machines, so the jobs that read them find a
  # hit for everything and compile nothing. The gate waits for the bench build
  # only and the docs check for the rustdoc build only; tests and the other
  # ecosystems' gates wait for neither. Each sets up the toolchain and cache
  # the reading job does, since the variables those export are part of the keys.
  build-bench:
    name: Build (bench)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.build_bench == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bench
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: "false"
          prebuild: bench
          prebuild-stage: ${{ runner.temp }}/store
          bin-cache: "true"
      - name: Upload the stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-bench
          path: ${{ runner.temp }}/store
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1

  build-rustdoc:
    name: Build (rustdoc)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.build_rustdoc == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rustdoc
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: "false"
          prebuild: rustdoc
          prebuild-docs: ${{ needs.plan.outputs.docs_package }}
          prebuild-stage: ${{ runner.temp }}/store
          rustdoc-cache: "true"
      - name: Upload the stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-rustdoc
          path: ${{ runner.temp }}/store
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1

  test:
    name: Test
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.test == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # The checkout has no default-branch ref for the CLI to diff against,
      # so the change is named by the commit the event started from.
      - name: Test
        shell: bash
        env:
          # Word-split on purpose: empty, or the two flags.
          ALL: ${{ needs.plan.outputs.test_all == 'true' && '--all --no-cache' || '' }}
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          echo 3 >"$RUNNER_TEMP/soothfast-exit"
          date +%s >"$RUNNER_TEMP/soothfast-start"
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PULL_BASE"
          elif [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BEFORE"
          fi
          args=(--all)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            args=(--base "$base")
          fi
          if [ -n "$ALL" ]; then args=(); fi
          rc=0
          cargo soothfast test $ALL "${args[@]}" --result "$RUNNER_TEMP/rust-result.json" 2>&1 | tee "$RUNNER_TEMP/soothfast-result.txt" || rc=$?
          echo "$rc" >"$RUNNER_TEMP/soothfast-exit"
          exit "$rc"
      # A job that stopped before the test command ran left the exit at 3. A
      # finished run wrote its own record, which also says when a test was flaky.
      - name: Record the verdict
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/soothfast-results"
          if [ -s "$RUNNER_TEMP/rust-result.json" ]; then
            cp "$RUNNER_TEMP/rust-result.json" "$RUNNER_TEMP/soothfast-results/result.json"
          else
            cargo soothfast verdict record --name test-rust --kind test \
              --exit "$(cat "$RUNNER_TEMP/soothfast-exit" 2>/dev/null || echo 3)" \
              --seconds "$(( $(date +%s) - $(cat "$RUNNER_TEMP/soothfast-start" 2>/dev/null || date +%s) ))" \
              --output "$RUNNER_TEMP/soothfast-result.txt" \
              --out "$RUNNER_TEMP/soothfast-results/result.json"
          fi
      - name: Upload the test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-rust
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  test-projects:
    name: Test (${{ matrix.name }})
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.test_projects == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: matrix.ecosystem == 'gradle' || matrix.ecosystem == 'maven'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: ${{ matrix.ecosystem }}
      - if: matrix.ecosystem == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}
      - if: matrix.ecosystem == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: ./.soothfast-action/action/install
      - if: matrix.ecosystem == 'node'
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Test
        shell: bash
        env:
          DIR: ${{ matrix.dir }}
          SUITE: ${{ matrix.suite }}
          NAME: ${{ matrix.name }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          RESULT: ${{ runner.temp }}/result.json
        run: |
          flags=(--project "$DIR" --all --no-cache --toolchain "$TOOLCHAIN" --result "$RESULT" --name "test-$NAME")
          [ -z "$SUITE" ] || flags+=(--suite "$SUITE")
          cargo soothfast test "${flags[@]}"
      - name: Upload the test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
      - name: Upload the stored pass
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-pass-${{ matrix.name }}
          path: .soothfast/tests
          include-hidden-files: true
          if-no-files-found: ignore

  # Merges the passes of this run into the cache the plan job restores. The
  # jobs that ran the tests cannot each save it: one cache entry holds the
  # passes of every project.
  test-cache:
    name: Save test passes
    needs: [plan, test-projects]
    if: "!cancelled() && needs.test-projects.result != 'skipped'"
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soothfast-tests-${{ github.ref_name }}-
            soothfast-tests-${{ github.event.repository.default_branch }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soothfast-pass-*
          path: .soothfast/tests
          merge-multiple: true
      # Keeps the newest 2048 passes, the bound the Rust test store keeps.
      - name: Prune the merged passes
        run: ls -t .soothfast/tests | tail -n +2049 | (cd .soothfast/tests && xargs -r rm -f --)
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  gate-rust:
    name: Gate${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    needs: [plan, build-bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'schedule' && needs.plan.outputs.packages != '' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # A failed build leaves nothing to download, and this job then compiles
      # for itself and reports the error in its own output.
      - name: Download the built stores
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-store-bench
          path: .soothfast
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: ${{ inputs.bot && 'true' || 'false' }}
          comment: "false"
          shard: ${{ matrix.shard }}
          # A pull request's shard measures some items, and a baseline holds
          # all of them. A push records every item in its first leg.
          save-baseline: ${{ (matrix.shard == '' || github.event_name != 'pull_request') && 'head' || '' }}
          # The build job owns the executables; only the changelog
          # regeneration on a default-branch push builds rustdoc here.
          rustdoc-cache: ${{ inputs.bot && github.event_name == 'push' && 'true' || 'false' }}
      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-rust${{ matrix.shard != '' && format('-shard-{0}', matrix.slug) || '' }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore
      # The docs job reads claims from this instead of measuring again. A
      # failing gate, or one whose bench binaries match the base, saves none.
      - name: Upload the head measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-baseline
          path: .soothfast/baselines/head.json
          if-no-files-found: ignore
      # A pull request that leaves the bench binaries unchanged saves none,
      # so the docs job falls back to the default branch's measurement.
      - name: Keep the default-branch measurement
        if: github.event_name == 'push' && hashFiles('.soothfast/baselines/head.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/baselines/head.json
          key: soothfast-baseline-${{ github.sha }}

  gate:
    name: Gate (${{ matrix.name }})
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.projects == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: matrix.ecosystem == 'gradle' || matrix.ecosystem == 'maven'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: ${{ matrix.ecosystem }}
      - if: matrix.ecosystem == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}
      - if: matrix.ecosystem == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # Both sides run on this runner. Walltime gates; set `walltime = "advisory"`
      # under [gate] in soothfast.toml if the runner is too noisy to trust.
      - name: Gate against the merge base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
          DIR: ${{ matrix.dir }}
          BENCH_CMD: ${{ matrix.bench_cmd }}
          OUT: ${{ matrix.bench_out }}
          FROM: ${{ matrix.from }}
          WALLTIME: ${{ matrix.walltime }}
          PREFIX: ${{ matrix.prefix }}
          RESULT: ${{ runner.temp }}/soothfast-result.txt
        # The exit file stays 3 (errored) until the gate command itself
        # finishes, so a failing bench, npm or worktree step is never a
        # regression. Everything the leg prints, stderr included, is the result.
        run: |
          echo 3 >"$RUNNER_TEMP/soothfast-exit"
          date +%s >"$RUNNER_TEMP/soothfast-start"
          {
            bench() { (cd "$1" && { [ "$ECOSYSTEM" != node ] || npm ci; } && eval "${BENCH_CMD//\{out\}/$OUT}"); }
            # Unique per run, so a worktree an earlier run left registered on a
            # persistent runner never collides.
            tree="$RUNNER_TEMP/soothfast-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            git worktree add "$tree" "$(git merge-base HEAD "origin/$BASE_REF")"
            trap 'git worktree remove --force "$tree" >/dev/null 2>&1 || true' EXIT
            base="$tree"
            [ "$DIR" = . ] || base="$tree/$DIR"
            bench .
            if ! bench "$base" || [ ! -f "$base/$OUT" ]; then
              echo "merge-base has no benchmark results; nothing to compare"
              echo "::notice::merge-base has no benchmark results; nothing to compare"
              echo 0 >"$RUNNER_TEMP/soothfast-exit"
              exit 0
            fi
            set +e
            cargo soothfast gate --import "$FROM" "$OUT" --reference-import "$FROM" "$base/$OUT" \
              ${PREFIX:+--prefix "$PREFIX"} ${WALLTIME:+--walltime "$WALLTIME"}
            rc=$?
            set -e
            echo "$rc" >"$RUNNER_TEMP/soothfast-exit"
            exit "$rc"
          } 2>&1 | tee "$RESULT"
      - name: Record the verdict
        if: always()
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          cargo soothfast verdict record --name "$NAME" --kind import \
            --exit "$(cat "$RUNNER_TEMP/soothfast-exit" 2>/dev/null || echo 3)" \
            --seconds "$(( $(date +%s) - $(cat "$RUNNER_TEMP/soothfast-start" 2>/dev/null || date +%s) ))" \
            --output "$RUNNER_TEMP/soothfast-result.txt" \
            --out "$RUNNER_TEMP/soothfast-results/result.json"
      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-${{ matrix.name }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  docs:
    name: Docs check
    needs: [plan, build-rustdoc, gate-rust]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.plan.outputs.docs == 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: needs.plan.outputs.docs_package != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - if: needs.plan.outputs.docs_package != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # The build job's rustdoc lane holds the rustdoc cache now, so this job
      # restores nothing of its own. A failed lane leaves nothing to download,
      # and the docs check then builds the JSON itself.
      - name: Download the built stores
        if: needs.plan.outputs.docs_package != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-store-rustdoc
          path: .soothfast
      - name: Download the head measurement
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-baseline
          path: .soothfast/baselines
      - name: Restore the default-branch measurement
        if: hashFiles('.soothfast/baselines/head.json') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/baselines/head.json
          key: soothfast-baseline-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: soothfast-baseline-
      - name: Check the docs
        shell: bash
        env:
          DOCS_PACKAGE: ${{ needs.plan.outputs.docs_package }}
          RESULT: ${{ runner.temp }}/soothfast-result.txt
        run: |
          echo 3 >"$RUNNER_TEMP/soothfast-exit"
          date +%s >"$RUNNER_TEMP/soothfast-start"
          args=()
          for package in $DOCS_PACKAGE; do args+=(-p "$package"); done
          : > "$RESULT"
          if [ -f .soothfast/baselines/head.json ]; then
            args+=(--baseline head)
          else
            echo "::warning::claims not evaluated: no measurement"
            echo "claims not evaluated: no measurement" >> "$RESULT"
            args+=(--skip-claims)
          fi
          rc=0
          cargo soothfast docs check "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/soothfast-result.txt" || rc=$?
          echo "$rc" >"$RUNNER_TEMP/soothfast-exit"
          exit "$rc"
      - name: Record the verdict
        if: always()
        shell: bash
        run: |
          cargo soothfast verdict record --name docs --kind docs \
            --exit "$(cat "$RUNNER_TEMP/soothfast-exit" 2>/dev/null || echo 3)" \
            --seconds "$(( $(date +%s) - $(cat "$RUNNER_TEMP/soothfast-start" 2>/dev/null || date +%s) ))" \
            --output "$RUNNER_TEMP/soothfast-result.txt" \
            --out "$RUNNER_TEMP/soothfast-results/result.json"
      - name: Upload the docs result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-docs
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  verdict:
    name: verdict
    needs: [plan, test, test-projects, gate-rust, gate, docs]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Only a repository for gh to read the pull request from.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # A pattern that matches nothing is not an error here: EXPECT turns a
      # missing result into an errored section.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: soothfast-result-*
          path: ${{ runner.temp }}/soothfast-results
      - name: Post the verdict
        env:
          CLI: ${{ steps.soothfast.outputs.bin }}
          RESULTS: ${{ runner.temp }}/soothfast-results
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_RUST: ${{ needs.plan.outputs.packages }}
          EXPECT_IMPORT: ${{ join(fromJSON(needs.plan.outputs.matrix).include.*.name, ' ') }}
          EXPECT_DOCS: ${{ needs.plan.outputs.docs == 'true' && 'docs' || '' }}
          EXPECT_TEST: ${{ needs.plan.outputs.test == 'true' && 'test-rust' || '' }} ${{ needs.plan.outputs.test_expect }}
        run: ./.soothfast-action/action/verdict.sh

  labels:
    name: Labels
    needs: plan
    if: inputs.bot && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          gate: "false"
          changelog: "false"
          labels: "true"
