name: soothfast-run

# The one workflow a repo calls. `cargo soothfast plan` reads the repo's
# soothfast.toml and says which jobs run; `cargo soothfast init` writes the
# caller.
on:
  workflow_call:
    inputs:
      soothfast_ref:
        description: "Commit, tag or branch of this repository the caller pins; the caller writes it"
        required: true
        type: string
      bot:
        description: "Land regenerated files and act on labels as soothfast-bot"
        required: false
        type: boolean
        default: false
      runs_on:
        description: "JSON runner labels for the plan job; the soothfast.toml [ci] table decides the rest"
        required: false
        type: string
        default: '"ubuntu-latest"'
      java:
        description: "Java version for Gradle and Maven projects"
        required: false
        type: string
        default: "21"
      node:
        description: "Node version for Node projects"
        required: false
        type: string
        default: "22"
      shard:
        description: "Legs the Rust gate is split into; each builds nothing and measures its share of the items"
        required: false
        type: number
        default: 1

permissions: {}

# Cargo colours its stderr even when piped, and the codes land in the verdict.
env:
  CARGO_TERM_COLOR: never

# Steps default to bash without pipefail otherwise, and a `| tee` would hide
# the failing command's exit status.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      projects: ${{ steps.plan.outputs.projects }}
      rust: ${{ steps.plan.outputs.rust }}
      test: ${{ steps.plan.outputs.test }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
      packages: ${{ steps.plan.outputs.packages }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_package: ${{ steps.plan.outputs.docs_package }}
      docs_binds_rust: ${{ steps.plan.outputs.docs_binds_rust }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_projects: ${{ steps.plan.outputs.test_projects }}
      test_all: ${{ steps.plan.outputs.test_all }}
      test_expect: ${{ steps.plan.outputs.test_expect }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # An empty ref would check out the default branch, which may predate this workflow.
      - name: Require the soothfast ref
        env:
          SOOTHFAST_REF: ${{ inputs.soothfast_ref }}
        run: |
          if [ -z "$SOOTHFAST_REF" ]; then
            echo "::error::soothfast_ref is empty; run cargo soothfast init to rewrite the caller"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action scripts at this workflow's own commit, whoever calls it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - name: Labels a writer applied
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .soothfast-action/action/writer-labels.sh
      # Stored passes are looked up here, before any job or toolchain exists,
      # so a test a pass covers costs no runner at all.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soothfast-tests-${{ github.ref_name }}-
            soothfast-tests-${{ github.event.repository.default_branch }}-
      - name: Plan
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.labels }}
          JAVA: ${{ inputs.java }}
          NODE: ${{ inputs.node }}
          SHARD: ${{ inputs.shard }}
          # A push records every item in its first leg; the others would only set up.
          FIRST_ONLY: ${{ github.event_name != 'pull_request' && 'true' || '' }}
          SETTLED: ${{ runner.temp }}/settled
        run: |
          cargo soothfast plan --github --java "$JAVA" --node "$NODE" \
            --shard "$SHARD" ${FIRST_ONLY:+--first-shard-only} \
            --results "$SETTLED" \
            ${BASE_REF:+--base "origin/$BASE_REF"} ${LABELS:+--labels "$LABELS"} >> "$GITHUB_OUTPUT"
      - name: Upload the results of tests that need no job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-settled
          path: ${{ runner.temp }}/settled
          if-no-files-found: ignore

  # Builds the bench and rustdoc stores on their own machines, so the gate and the docs check compile nothing.
  # Toolchain and cache setup match the reading jobs, since the variables they export are in the store keys.
  build-bench:
    name: Build (bench)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.packages != ''
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - id: prebuild
        uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: "false"
          prebuild: bench
          prebuild-shards: ${{ github.event_name == 'pull_request' && inputs.shard || 1 }}
          prebuild-stage: ${{ runner.temp }}/store
          bin-cache: "true"
      - name: Pack the stores
        if: always()
        run: if [ -d "$RUNNER_TEMP/store" ]; then tar -C "$RUNNER_TEMP/store" -cf "$RUNNER_TEMP/store.tar" .; fi
      - name: Upload the stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-bench
          path: ${{ runner.temp }}/store.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1
      # Each package's planned items, read from what the prebuild built, so
      # the docs job can name the items of a gate leg that uploaded nothing.
      # A package whose build failed is skipped with a warning.
      - name: List each package's items
        if: always()
        shell: bash
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          mkdir -p "$RUNNER_TEMP/soothfast-plan"
          for pkg in $PACKAGES; do
            cargo soothfast baseline plan --out "$RUNNER_TEMP/soothfast-plan/plan.json" -p "$pkg" \
              || echo "::warning::could not list ${pkg}'s items for the docs check"
          done
      - name: Upload the item listing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-plan
          path: ${{ runner.temp }}/soothfast-plan/plan.json
          if-no-files-found: ignore
          retention-days: 1

  build-rustdoc:
    name: Build (rustdoc)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.docs_binds_rust != 'false'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: pin
        run: echo "toolchain=$(./.soothfast-action/action/rustdoc-toolchain.sh --print)" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rustdoc
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: "false"
          prebuild: rustdoc
          prebuild-docs: ${{ needs.plan.outputs.docs_package }}
          prebuild-stage: ${{ runner.temp }}/store
          rustdoc-cache: "true"
      - name: Pack the stores
        if: always()
        run: if [ -d "$RUNNER_TEMP/store" ]; then tar -C "$RUNNER_TEMP/store" -cf "$RUNNER_TEMP/store.tar" .; fi
      - name: Upload the stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-rustdoc
          path: ${{ runner.temp }}/store.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1

  test:
    name: Test
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.test == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # The checkout has no default-branch ref for the CLI to diff against,
      # so the change is named by the commit the event started from.
      - name: Test
        shell: bash
        env:
          # Word-split on purpose: empty, or the two flags.
          ALL: ${{ needs.plan.outputs.test_all == 'true' && '--all --no-cache' || '' }}
          EVENT: ${{ github.event_name }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          echo 3 >"$RUNNER_TEMP/soothfast-exit"
          date +%s >"$RUNNER_TEMP/soothfast-start"
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PULL_BASE"
          elif [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BEFORE"
          fi
          args=(--all)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            args=(--base "$base")
          fi
          if [ -n "$ALL" ]; then args=(); fi
          rc=0
          cargo soothfast test $ALL "${args[@]}" --result "$RUNNER_TEMP/rust-result.json" 2>&1 | tee "$RUNNER_TEMP/soothfast-result.txt" || rc=$?
          echo "$rc" >"$RUNNER_TEMP/soothfast-exit"
          exit "$rc"
      # A job that stopped before the test command ran left the exit at 3. A
      # finished run wrote its own record, which also says when a test was flaky.
      - name: Record the verdict
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/soothfast-results"
          if [ -s "$RUNNER_TEMP/rust-result.json" ]; then
            cp "$RUNNER_TEMP/rust-result.json" "$RUNNER_TEMP/soothfast-results/result.json"
          else
            cargo soothfast verdict record --name test-rust --kind test \
              --exit "$(cat "$RUNNER_TEMP/soothfast-exit" 2>/dev/null || echo 3)" \
              --seconds "$(( $(date +%s) - $(cat "$RUNNER_TEMP/soothfast-start" 2>/dev/null || date +%s) ))" \
              --output "$RUNNER_TEMP/soothfast-result.txt" \
              --out "$RUNNER_TEMP/soothfast-results/result.json"
          fi
      - name: Upload the test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-rust
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  test-projects:
    name: Test (${{ matrix.name }})
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.test_projects == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: matrix.ecosystem == 'gradle' || matrix.ecosystem == 'maven'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: ${{ matrix.ecosystem }}
      - if: matrix.ecosystem == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}
      - if: matrix.ecosystem == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: ./.soothfast-action/action/install
      - if: matrix.ecosystem == 'node'
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Test
        shell: bash
        env:
          DIR: ${{ matrix.dir }}
          SUITE: ${{ matrix.suite }}
          NAME: ${{ matrix.name }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          RESULT: ${{ runner.temp }}/result.json
        run: |
          flags=(--project "$DIR" --all --no-cache --toolchain "$TOOLCHAIN" --result "$RESULT" --name "test-$NAME")
          [ -z "$SUITE" ] || flags+=(--suite "$SUITE")
          cargo soothfast test "${flags[@]}"
      - name: Upload the test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
      - name: Upload the stored pass
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-pass-${{ matrix.name }}
          path: .soothfast/tests
          include-hidden-files: true
          if-no-files-found: ignore

  # Merges the passes of this run into the cache the plan job restores. The
  # jobs that ran the tests cannot each save it: one cache entry holds the
  # passes of every project.
  test-cache:
    name: Save test passes
    needs: [plan, test-projects]
    if: "!cancelled() && needs.test-projects.result != 'skipped'"
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soothfast-tests-${{ github.ref_name }}-
            soothfast-tests-${{ github.event.repository.default_branch }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soothfast-pass-*
          path: .soothfast/tests
          merge-multiple: true
      # Keeps the newest 2048 passes, the bound the Rust test store keeps.
      - name: Prune the merged passes
        run: ls -t .soothfast/tests | tail -n +2049 | (cd .soothfast/tests && xargs -r rm -f --)
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  gate-rust:
    name: Gate${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    needs: [plan, build-bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'schedule' && needs.plan.outputs.packages != '' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # A failed build leaves nothing to download, and this job then compiles
      # for itself and reports the error in its own output.
      - name: Download the built stores
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-store-bench
          path: ${{ runner.temp }}/store-in
      - name: Check the built stores
        id: store
        run: echo "hit=$([ -f "$RUNNER_TEMP/store-in/store.tar" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      # On a store hit nothing compiles, so only the variable rust-cache sets, which the store keys name, is kept.
      - name: Match the build job's environment
        if: steps.store.outputs.hit == 'true'
        run: echo "CARGO_INCREMENTAL=0" >>"$GITHUB_ENV"
      - if: steps.store.outputs.hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
          save-if: "false"
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # A tar keeps the executables' modes, which an artifact drops.
      - name: Unpack the built stores
        run: |
          if [ -f "$RUNNER_TEMP/store-in/store.tar" ]; then
            mkdir -p .soothfast
            tar -xf "$RUNNER_TEMP/store-in/store.tar" -C .soothfast
          fi
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: ${{ inputs.bot && 'true' || 'false' }}
          comment: "false"
          shard: ${{ matrix.shard }}
          # Each pull-request leg saves the items its shard owns; the docs job
          # merges the legs. A push records every item in its first leg.
          save-baseline: head
          # The build job owns the executables; only the changelog
          # regeneration on a default-branch push builds rustdoc here.
          rustdoc-cache: ${{ inputs.bot && github.event_name == 'push' && 'true' || 'false' }}
      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-rust${{ matrix.shard != '' && format('-shard-{0}', matrix.slug) || '' }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore
      # The docs job reads claims from this instead of measuring again. A
      # failing package saves nothing, and the merge names its items.
      - name: Upload the head measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-baseline-rust${{ matrix.shard != '' && format('-shard-{0}', matrix.slug) || '' }}
          path: .soothfast/baselines/head.json
          if-no-files-found: ignore

  gate:
    name: Gate (${{ matrix.name }})
    needs: plan
    # The events gate-rust runs on; outside a pull request it only records HEAD's numbers.
    if: github.event_name != 'schedule' && needs.plan.outputs.projects == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: matrix.ecosystem == 'gradle' || matrix.ecosystem == 'maven'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: ${{ matrix.ecosystem }}
      - if: matrix.ecosystem == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}
      - if: matrix.ecosystem == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # Both sides run on this runner. Walltime gates; set `walltime = "advisory"`
      # under [gate] in soothfast.toml if the runner is too noisy to trust.
      - name: Gate against the merge base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
          DIR: ${{ matrix.dir }}
          BENCH_CMD: ${{ matrix.bench_cmd }}
          OUT: ${{ matrix.bench_out }}
          FROM: ${{ matrix.from }}
          WALLTIME: ${{ matrix.walltime }}
          PREFIX: ${{ matrix.prefix }}
          NAME: ${{ matrix.name }}
          RESULT: ${{ runner.temp }}/soothfast-result.txt
        # The exit file stays 3 (errored) until the gate command itself
        # finishes, so a failing bench, npm or worktree step is never a
        # regression. Everything the leg prints, stderr included, is the result.
        # A gate that did not error saves HEAD's items for the docs job, and a
        # passing one that cannot save them errors.
        run: |
          echo 3 >"$RUNNER_TEMP/soothfast-exit"
          date +%s >"$RUNNER_TEMP/soothfast-start"
          {
            bench() { (cd "$1" && { [ "$ECOSYSTEM" != node ] || npm ci; } && eval "${BENCH_CMD//\{out\}/$OUT}"); }
            save() {
              mkdir -p "$RUNNER_TEMP/soothfast-baseline"
              cargo soothfast import --from "$FROM" "$OUT" ${PREFIX:+--prefix "$PREFIX"} \
                --out "$RUNNER_TEMP/soothfast-baseline/import-$NAME.json"
            }
            passed() {
              if ! save; then
                : >"$RUNNER_TEMP/soothfast-save-failed-$NAME"
                echo "::error::save failed: the import gate passed, but HEAD's imported items could not be saved (a save or config error, not a gate failure)"
                exit 3
              fi
              echo 0 >"$RUNNER_TEMP/soothfast-exit"
              exit 0
            }
            if [ -z "$BASE_REF" ]; then
              bench .
              passed
            fi
            # Unique per run, so a worktree an earlier run left registered on a
            # persistent runner never collides.
            tree="$RUNNER_TEMP/soothfast-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            git worktree add "$tree" "$(git merge-base HEAD "origin/$BASE_REF")"
            trap 'git worktree remove --force "$tree" >/dev/null 2>&1 || true' EXIT
            base="$tree"
            [ "$DIR" = . ] || base="$tree/$DIR"
            # Each bench runs under errexit of its own, outside any || list,
            # and its status is read after.
            keep_base() { [ ! -f "$base/$OUT" ] || cp "$base/$OUT" "$RUNNER_TEMP/soothfast-base-results-$NAME"; }
            set +e; ( set -e; bench . ); head_rc=$?; set -e
            # HEAD with no results: the merge-base's name the items its failed gate covers.
            if [ "$head_rc" -ne 0 ] || [ ! -f "$OUT" ]; then
              set +e; ( set -e; bench "$base" ); set -e
              keep_base
              exit 1
            fi
            set +e; ( set -e; bench "$base" ); base_rc=$?; set -e
            keep_base
            if [ "$base_rc" -ne 0 ] || [ ! -f "$base/$OUT" ]; then
              echo "merge-base has no benchmark results; nothing to compare"
              echo "::notice::merge-base has no benchmark results; nothing to compare"
              passed
            fi
            set +e
            cargo soothfast gate --import "$FROM" "$OUT" --reference-import "$FROM" "$base/$OUT" \
              ${PREFIX:+--prefix "$PREFIX"} ${WALLTIME:+--walltime "$WALLTIME"}
            rc=$?
            set -e
            [ "$rc" -ne 0 ] || passed
            echo "$rc" >"$RUNNER_TEMP/soothfast-exit"
            # Regressions are measured numbers; only an error saves none.
            if [ "$rc" -eq 1 ] && ! save; then
              echo "::error::could not save HEAD's imported items"
            fi
            exit "$rc"
          } 2>&1 | tee "$RESULT"
      # A gate that saved no numbers still names its items, so the docs job
      # reports their unchanged claims not evaluated.
      - name: List a failed gate's items
        if: always()
        shell: bash
        env:
          FROM: ${{ matrix.from }}
          OUT: ${{ matrix.bench_out }}
          PREFIX: ${{ matrix.prefix }}
          NAME: ${{ matrix.name }}
        run: |
          file="$RUNNER_TEMP/soothfast-baseline/import-$NAME.json"
          if [ ! -f "$file" ]; then
            mkdir -p "$RUNNER_TEMP/soothfast-baseline"
            base="$RUNNER_TEMP/soothfast-base-results-$NAME"
            names=()
            [ ! -f "$base" ] || names+=(--base-results "$base")
            [ ! -f "$RUNNER_TEMP/soothfast-save-failed-$NAME" ] || names+=(--save-failed)
            cargo soothfast import --from "$FROM" "$OUT" ${PREFIX:+--prefix "$PREFIX"} --out "$file" --failed "${names[@]}"
          fi
      - name: Record the verdict
        if: always()
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          cargo soothfast verdict record --name "$NAME" --kind import \
            --exit "$(cat "$RUNNER_TEMP/soothfast-exit" 2>/dev/null || echo 3)" \
            --seconds "$(( $(date +%s) - $(cat "$RUNNER_TEMP/soothfast-start" 2>/dev/null || date +%s) ))" \
            --output "$RUNNER_TEMP/soothfast-result.txt" \
            --out "$RUNNER_TEMP/soothfast-results/result.json"
      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-${{ matrix.name }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore
      - name: Upload the imported measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-baseline-import-${{ matrix.name }}
          path: ${{ runner.temp }}/soothfast-baseline/import-${{ matrix.name }}.json
          if-no-files-found: ignore

  docs:
    name: Docs check
    needs: [plan, build-rustdoc, gate-rust, gate]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.plan.outputs.docs == 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # History for the merge-base, whose claims decide which are unchanged.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: pin
        if: needs.plan.outputs.docs_binds_rust != 'false'
        run: echo "toolchain=$(./.soothfast-action/action/rustdoc-toolchain.sh --print)" >>"$GITHUB_OUTPUT"
      - if: needs.plan.outputs.docs_binds_rust != 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      # A failed rustdoc build leaves nothing to download, and the docs check then builds the JSON itself.
      - name: Download the built stores
        if: needs.plan.outputs.docs_binds_rust != 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-store-rustdoc
          path: ${{ runner.temp }}/store-in
      - name: Check the built stores
        id: store
        run: echo "hit=$([ -f "$RUNNER_TEMP/store-in/store.tar" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      - name: Match the build job's environment
        if: steps.store.outputs.hit == 'true'
        run: echo "CARGO_INCREMENTAL=0" >>"$GITHUB_ENV"
      - if: needs.plan.outputs.docs_binds_rust != 'false' && steps.store.outputs.hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rustdoc
          save-if: "false"
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # The rustdoc store is keyed by this toolchain, so the check must use the one that built it.
      - name: Install the pinned rustdoc toolchain
        if: needs.plan.outputs.docs_binds_rust != 'false'
        run: ./.soothfast-action/action/rustdoc-toolchain.sh
      # The cache is the fallback for a store that misses or a failed rustdoc build.
      - name: Name the rustdoc cache
        if: needs.plan.outputs.docs_binds_rust != 'false'
        id: rustdoc-key
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: echo "prefix=soothfast-rustdoc-${GITHUB_JOB}--${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}" >>"$GITHUB_OUTPUT"
      - name: Restore this branch's rustdoc JSON
        if: needs.plan.outputs.docs_binds_rust != 'false' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/rustdoc
          key: ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.ref_name }}-
      - name: Set the branch's rustdoc JSON aside
        if: needs.plan.outputs.docs_binds_rust != 'false' && github.event_name == 'pull_request'
        run: |
          if [ -d .soothfast/rustdoc ]; then
            mkdir -p .soothfast-rustdoc-branch
            mv .soothfast/rustdoc .soothfast-rustdoc-branch/rustdoc
          fi
      - name: Restore and save rustdoc JSON
        if: needs.plan.outputs.docs_binds_rust != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/rustdoc
          key: ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.event.pull_request.base.ref || github.ref_name }}-
            ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.event.repository.default_branch }}-
      - name: Merge the branch's rustdoc JSON
        if: needs.plan.outputs.docs_binds_rust != 'false' && github.event_name == 'pull_request'
        env:
          CLI: ${{ steps.soothfast.outputs.bin }}
        run: |
          if [ -d .soothfast-rustdoc-branch ]; then
            "$CLI" cache merge --from .soothfast-rustdoc-branch
            rm -rf .soothfast-rustdoc-branch
          fi
      - name: Unpack the built stores
        if: needs.plan.outputs.docs_binds_rust != 'false'
        run: |
          if [ -f "$RUNNER_TEMP/store-in/store.tar" ]; then
            mkdir -p .soothfast
            tar -xf "$RUNNER_TEMP/store-in/store.tar" -C .soothfast
          fi
      # Only this run's own legs: each artifact lands in its own directory.
      - name: Download this run's measurements
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soothfast-baseline-*
          path: ${{ runner.temp }}/baselines
      - name: Download the item listing
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-plan
          path: ${{ runner.temp }}/plan
      - name: Check the docs
        shell: bash
        env:
          DOCS_PACKAGE: ${{ needs.plan.outputs.docs_package }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
          # A push records every item in one unsharded leg.
          EXPECT: ${{ github.event_name == 'pull_request' && inputs.shard > 1 && inputs.shard || 1 }}
          BASE_REF: ${{ github.base_ref }}
          PROJECTS: ${{ needs.plan.outputs.projects }}
          EVENT: ${{ github.event_name }}
          # The cargo gate gates a pull request and records a default-branch push, nothing else.
          GATED: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
          RESULT: ${{ runner.temp }}/soothfast-result.txt
        run: |
          echo 3 >"$RUNNER_TEMP/soothfast-exit"
          date +%s >"$RUNNER_TEMP/soothfast-start"
          args=()
          for package in $DOCS_PACKAGE; do args+=(-p "$package"); done
          if [ -n "$BASE_REF" ]; then
            args+=(--against-ref "origin/$BASE_REF")
          elif git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
            args+=(--against-ref 'HEAD^')
          fi
          : > "$RESULT"
          skip() {
            echo "::warning::claims not evaluated: $1"
            echo "claims not evaluated: $1" >> "$RESULT"
            args+=(--skip-claims)
          }
          shopt -s nullglob
          files=("$RUNNER_TEMP"/baselines/*/*.json)
          merged=0
          merge_args=()
          [ "$GATED" = true ] || merge_args=(--not-gated "$EVENT")
          [ ! -f "$RUNNER_TEMP/plan/plan.json" ] || merge_args+=(--plan "$RUNNER_TEMP/plan/plan.json")
          if [ -z "$PACKAGES" ] && [ "$PROJECTS" != true ]; then
            skip "no gate measures this repository"
          else
            cargo soothfast baseline merge --into head --expect "$EXPECT" --packages "$PACKAGES" "${merge_args[@]}" \
              "${files[@]}" 2>&1 | tee -a "$RESULT" || merged=$?
            # A merge that failed still leaves binds and examples to check; the step fails either way.
            if [ "$merged" -eq 0 ]; then args+=(--baseline head); else args+=(--skip-claims); fi
          fi
          rc=0
          cargo soothfast docs check "${args[@]}" 2>&1 | tee -a "$RESULT" || rc=$?
          if [ "$merged" -ne 0 ]; then rc=$merged; fi
          echo "$rc" >"$RUNNER_TEMP/soothfast-exit"
          exit "$rc"
      - name: Record the verdict
        if: always()
        shell: bash
        run: |
          cargo soothfast verdict record --name docs --kind docs \
            --exit "$(cat "$RUNNER_TEMP/soothfast-exit" 2>/dev/null || echo 3)" \
            --seconds "$(( $(date +%s) - $(cat "$RUNNER_TEMP/soothfast-start" 2>/dev/null || date +%s) ))" \
            --output "$RUNNER_TEMP/soothfast-result.txt" \
            --out "$RUNNER_TEMP/soothfast-results/result.json"
      - name: Upload the docs result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-docs
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  verdict:
    name: verdict
    needs: [plan, test, test-projects, gate-rust, gate, docs]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Only a repository for gh to read the pull request from.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # A pattern that matches nothing is not an error here: EXPECT turns a
      # missing result into an errored section.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: soothfast-result-*
          path: ${{ runner.temp }}/soothfast-results
      - name: Post the verdict
        env:
          CLI: ${{ steps.soothfast.outputs.bin }}
          RESULTS: ${{ runner.temp }}/soothfast-results
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_RUST: ${{ needs.plan.outputs.packages }}
          EXPECT_SHARDS: ${{ join(fromJSON(needs.plan.outputs.shards).include.*.shard, ' ') }}
          EXPECT_IMPORT: ${{ join(fromJSON(needs.plan.outputs.matrix).include.*.name, ' ') }}
          EXPECT_DOCS: ${{ needs.plan.outputs.docs == 'true' && 'docs' || '' }}
          EXPECT_TEST: ${{ needs.plan.outputs.test == 'true' && 'test-rust' || '' }} ${{ needs.plan.outputs.test_expect }}
        run: ./.soothfast-action/action/verdict.sh

  labels:
    name: Labels
    needs: plan
    if: inputs.bot && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          gate: "false"
          changelog: "false"
          labels: "true"
