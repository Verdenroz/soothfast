name: soothfast-run

# The one workflow a repo calls. `cargo soothfast plan` reads the repo's
# soothfast.toml and says which jobs run; `cargo soothfast init` writes the
# caller.
on:
  workflow_call:
    inputs:
      soothfast_ref:
        description: "Commit, tag or branch of this repository the caller pins; the caller writes it"
        required: true
        type: string
      bot:
        description: "Land regenerated files and act on labels as soothfast-bot"
        required: false
        type: boolean
        default: false
      runs_on:
        description: "JSON runner labels for the plan job; the soothfast.toml [ci] table decides the rest"
        required: false
        type: string
        default: '"ubuntu-latest"'
      java:
        description: "Java version for Gradle and Maven projects"
        required: false
        type: string
        default: "21"
      node:
        description: "Node version for Node projects"
        required: false
        type: string
        default: "22"
      shard:
        description: "Legs the Rust gate is split into; each builds nothing and measures its share of the items"
        required: false
        type: number
        default: 1

permissions: {}

# Cargo colours its stderr even when piped, and the codes land in the verdict.
env:
  CARGO_TERM_COLOR: never

# Steps default to bash without pipefail otherwise, and a `| tee` would hide
# the failing command's exit status.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      projects: ${{ steps.plan.outputs.projects }}
      rust: ${{ steps.plan.outputs.rust }}
      test: ${{ steps.plan.outputs.test }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
      packages: ${{ steps.plan.outputs.packages }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_package: ${{ steps.plan.outputs.docs_package }}
      docs_binds_rust: ${{ steps.plan.outputs.docs_binds_rust }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      test_projects: ${{ steps.plan.outputs.test_projects }}
      test_all: ${{ steps.plan.outputs.test_all }}
      test_expect: ${{ steps.plan.outputs.test_expect }}
      shards: ${{ steps.plan.outputs.shards }}
      checks: ${{ steps.plan.outputs.checks }}
      checks_any: ${{ steps.plan.outputs.checks_any }}
      checks_expect: ${{ steps.plan.outputs.checks_expect }}
      site_in_docs: ${{ steps.plan.outputs.site_in_docs }}
      site_deploy: ${{ steps.plan.outputs.site_deploy }}
      trend_url: ${{ steps.plan.outputs.trend_url }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # An empty ref would check out the default branch, which may predate this workflow.
      - name: Require the soothfast ref
        env:
          SOOTHFAST_REF: ${{ inputs.soothfast_ref }}
        run: |
          if [ -z "$SOOTHFAST_REF" ]; then
            echo "::error::soothfast_ref is empty; run cargo soothfast init to rewrite the caller"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action scripts at this workflow's own commit, whoever calls it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - name: Labels a writer applied
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .soothfast-action/action/writer-labels.sh
      # Stored passes are looked up here, before any job or toolchain exists,
      # so a test a pass covers costs no runner at all.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soothfast-tests-${{ github.ref_name }}-
            soothfast-tests-${{ github.event.repository.default_branch }}-
      - name: Plan
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.labels }}
          JAVA: ${{ inputs.java }}
          NODE: ${{ inputs.node }}
          SHARD: ${{ inputs.shard }}
          # A push records every item in its first leg; the others would only set up.
          FIRST_ONLY: ${{ github.event_name != 'pull_request' && 'true' || '' }}
          SETTLED: ${{ runner.temp }}/settled
        run: |
          cargo soothfast plan --github --java "$JAVA" --node "$NODE" \
            --shard "$SHARD" ${FIRST_ONLY:+--first-shard-only} \
            --results "$SETTLED" \
            ${BASE_REF:+--base "origin/$BASE_REF"} ${LABELS:+--labels "$LABELS"} >> "$GITHUB_OUTPUT"
      - name: Upload the results of tests that need no job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-settled-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settled
          if-no-files-found: ignore

  # Builds the bench and rustdoc stores on their own machines, so the gate and the docs check compile nothing.
  # Toolchain and cache setup match the reading jobs, since the variables they export are in the store keys.
  build-bench:
    name: Build (bench)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.packages != ''
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - id: prebuild
        uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: "false"
          labels: "false"
          prebuild: bench
          prebuild-shards: ${{ github.event_name == 'pull_request' && inputs.shard || 1 }}
          prebuild-stage: ${{ runner.temp }}/store
          bin-cache: "true"
      - name: Pack the stores
        if: always()
        run: if [ -d "$RUNNER_TEMP/store" ]; then tar -C "$RUNNER_TEMP/store" -cf "$RUNNER_TEMP/store.tar" .; fi
      - name: Upload the stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-bench
          path: ${{ runner.temp }}/store.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1
      # Each package's planned items, read from what the prebuild built, so
      # the docs job can name the items of a gate leg that uploaded nothing.
      # A package whose build failed is skipped with a warning.
      - name: List each package's items
        if: always()
        shell: bash
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          mkdir -p "$RUNNER_TEMP/soothfast-plan"
          for pkg in $PACKAGES; do
            cargo soothfast baseline plan --out "$RUNNER_TEMP/soothfast-plan/plan.json" -p "$pkg" \
              || echo "::warning::could not list ${pkg}'s items for the docs check"
          done
      - name: Upload the item listing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-plan
          path: ${{ runner.temp }}/soothfast-plan/plan.json
          if-no-files-found: ignore
          retention-days: 1

  build-rustdoc:
    name: Build (rustdoc)
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.docs_binds_rust != 'false'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: pin
        run: echo "toolchain=$(./.soothfast-action/action/rustdoc-toolchain.sh --print)" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rustdoc
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: "false"
          labels: "false"
          prebuild: rustdoc
          prebuild-docs: ${{ needs.plan.outputs.docs_package }}
          prebuild-stage: ${{ runner.temp }}/store
          rustdoc-cache: "true"
      - name: Pack the stores
        if: always()
        run: if [ -d "$RUNNER_TEMP/store" ]; then tar -C "$RUNNER_TEMP/store" -cf "$RUNNER_TEMP/store.tar" .; fi
      - name: Upload the stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-rustdoc
          path: ${{ runner.temp }}/store.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1

  test:
    name: Test
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.test == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.soothfast-action/action/install
      - name: Test
        env:
          # Word-split on purpose: empty, or the flag.
          ALL: ${{ needs.plan.outputs.test_all == 'true' && '--all' || '' }}
        run: cargo soothfast ci test $ALL
      - name: Upload the test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-rust-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  test-projects:
    name: Test (${{ matrix.name }})
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.test_projects == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: matrix.ecosystem == 'gradle' || matrix.ecosystem == 'maven'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: ${{ matrix.ecosystem }}
      - if: matrix.ecosystem == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}
      - if: matrix.ecosystem == 'python'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.soothfast-action/action/install
      - if: matrix.ecosystem == 'node'
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Test
        env:
          DIR: ${{ matrix.dir }}
          SUITE: ${{ matrix.suite }}
          NAME: ${{ matrix.name }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          flags=(--project "$DIR" --toolchain "$TOOLCHAIN" --name "test-$NAME")
          [ -z "$SUITE" ] || flags+=(--suite "$SUITE")
          cargo soothfast ci test "${flags[@]}"
      - name: Upload the test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-test-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore
      - name: Upload the stored pass
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-pass-${{ matrix.name }}
          path: .soothfast/tests
          include-hidden-files: true
          if-no-files-found: ignore

  # Merges the passes of this run into the cache the plan job restores. The
  # jobs that ran the tests cannot each save it: one cache entry holds the
  # passes of every project.
  test-cache:
    name: Save test passes
    needs: [plan, test-projects]
    if: "!cancelled() && needs.test-projects.result != 'skipped'"
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            soothfast-tests-${{ github.ref_name }}-
            soothfast-tests-${{ github.event.repository.default_branch }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soothfast-pass-*
          path: .soothfast/tests
          merge-multiple: true
      # Keeps the newest 2048 passes, the bound the Rust test store keeps.
      - name: Prune the merged passes
        run: ls -t .soothfast/tests | tail -n +2049 | (cd .soothfast/tests && xargs -r rm -f --)
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/tests
          key: soothfast-tests-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  gate-rust:
    name: Gate${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    needs: [plan, build-bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'schedule' && needs.plan.outputs.packages != '' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # A failed build leaves nothing to download, and this job then compiles
      # for itself and reports the error in its own output.
      - name: Download the built stores
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soothfast-store-bench
          path: ${{ runner.temp }}/store-in
      - name: Check the built stores
        id: store
        run: echo "hit=$([ -f "$RUNNER_TEMP/store-in/store.tar" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      # On a store hit nothing compiles, so only the variable rust-cache sets, which the store keys name, is kept.
      - name: Match the build job's environment
        if: steps.store.outputs.hit == 'true'
        run: echo "CARGO_INCREMENTAL=0" >>"$GITHUB_ENV"
      - if: steps.store.outputs.hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
          save-if: "false"
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # A tar keeps the executables' modes, which an artifact drops.
      - name: Unpack the built stores
        run: |
          if [ -f "$RUNNER_TEMP/store-in/store.tar" ]; then
            mkdir -p .soothfast
            tar -xf "$RUNNER_TEMP/store-in/store.tar" -C .soothfast
          fi
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          packages: ${{ needs.plan.outputs.packages }}
          changelog: ${{ inputs.bot && 'true' || 'false' }}
          labels: "false"
          comment: "false"
          shard: ${{ matrix.shard }}
          # Each pull-request leg saves the items its shard owns; the docs job
          # merges the legs. A push records every item in its first leg.
          save-baseline: head
          # The build job owns the executables; only the changelog
          # regeneration on a default-branch push builds rustdoc here.
          rustdoc-cache: ${{ inputs.bot && github.event_name == 'push' && 'true' || 'false' }}
      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-rust${{ matrix.shard != '' && format('-shard-{0}', matrix.slug) || '' }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore
      # The docs job reads claims from this instead of measuring again. A
      # failing package saves nothing, and the merge names its items.
      - name: Upload the head measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-baseline-rust${{ matrix.shard != '' && format('-shard-{0}', matrix.slug) || '' }}-attempt-${{ github.run_attempt }}
          path: .soothfast/baselines/head.json
          if-no-files-found: ignore

  gate:
    name: Gate (${{ matrix.name }})
    needs: plan
    # The events gate-rust runs on; outside a pull request it only records HEAD's numbers.
    if: github.event_name != 'schedule' && needs.plan.outputs.projects == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - if: matrix.ecosystem == 'gradle' || matrix.ecosystem == 'maven'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: ${{ matrix.ecosystem }}
      - if: matrix.ecosystem == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}
      - if: matrix.ecosystem == 'python'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.soothfast-action/action/install
      # Both sides run on this runner. Walltime gates; set `walltime = "advisory"`
      # under [gate] in soothfast.toml if the runner is too noisy to trust.
      - name: Gate against the merge base
        env:
          DIR: ${{ matrix.dir }}
          NAME: ${{ matrix.name }}
        run: cargo soothfast ci gate-import --project "$DIR" --name "$NAME"
      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore
      - name: Upload the imported measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-baseline-import-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-baseline/import-${{ matrix.name }}.json
          if-no-files-found: ignore

  docs:
    name: Docs check
    needs: [plan, build-rustdoc, gate-rust, gate, check]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.plan.outputs.docs == 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # History for the merge-base, whose claims decide which are unchanged.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: pin
        if: needs.plan.outputs.docs_binds_rust != 'false'
        run: echo "toolchain=$(./.soothfast-action/action/rustdoc-toolchain.sh --print)" >>"$GITHUB_OUTPUT"
      - if: needs.plan.outputs.docs_binds_rust != 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      # A failed rustdoc build leaves nothing to download, and the docs check then builds the JSON itself.
      - name: Download the built stores
        if: needs.plan.outputs.docs_binds_rust != 'false'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soothfast-store-rustdoc
          path: ${{ runner.temp }}/store-in
      - name: Check the built stores
        id: store
        run: echo "hit=$([ -f "$RUNNER_TEMP/store-in/store.tar" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
      - name: Match the build job's environment
        if: steps.store.outputs.hit == 'true'
        run: echo "CARGO_INCREMENTAL=0" >>"$GITHUB_ENV"
      - if: needs.plan.outputs.docs_binds_rust != 'false' && steps.store.outputs.hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rustdoc
          save-if: "false"
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # The rustdoc store is keyed by this toolchain, so the check must use the one that built it.
      - name: Install the pinned rustdoc toolchain
        if: needs.plan.outputs.docs_binds_rust != 'false'
        run: ./.soothfast-action/action/rustdoc-toolchain.sh
      # The cache is the fallback for a store that misses or a failed rustdoc build.
      - name: Name the rustdoc cache
        if: needs.plan.outputs.docs_binds_rust != 'false'
        id: rustdoc-key
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: echo "prefix=soothfast-rustdoc-${GITHUB_JOB}--${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}" >>"$GITHUB_OUTPUT"
      - name: Restore this branch's rustdoc JSON
        if: needs.plan.outputs.docs_binds_rust != 'false' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/rustdoc
          key: ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.ref_name }}-
      - name: Set the branch's rustdoc JSON aside
        if: needs.plan.outputs.docs_binds_rust != 'false' && github.event_name == 'pull_request'
        run: |
          if [ -d .soothfast/rustdoc ]; then
            mkdir -p .soothfast-rustdoc-branch
            mv .soothfast/rustdoc .soothfast-rustdoc-branch/rustdoc
          fi
      - name: Restore and save rustdoc JSON
        if: needs.plan.outputs.docs_binds_rust != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/rustdoc
          key: ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.event.pull_request.base.ref || github.ref_name }}-
            ${{ steps.rustdoc-key.outputs.prefix }}-${{ github.event.repository.default_branch }}-
      - name: Merge the branch's rustdoc JSON
        if: needs.plan.outputs.docs_binds_rust != 'false' && github.event_name == 'pull_request'
        env:
          CLI: ${{ steps.soothfast.outputs.bin }}
        run: |
          if [ -d .soothfast-rustdoc-branch ]; then
            "$CLI" cache merge --from .soothfast-rustdoc-branch
            rm -rf .soothfast-rustdoc-branch
          fi
      - name: Unpack the built stores
        if: needs.plan.outputs.docs_binds_rust != 'false'
        run: |
          if [ -f "$RUNNER_TEMP/store-in/store.tar" ]; then
            mkdir -p .soothfast
            tar -xf "$RUNNER_TEMP/store-in/store.tar" -C .soothfast
          fi
      # A site with routes pages reads the executables and rustdoc JSON the
      # spec jobs built, so this job compiles neither again.
      - name: Download the spec jobs' builds
        if: needs.plan.outputs.site_in_docs == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soothfast-store-spec-*
          path: ${{ runner.temp }}/spec-stores
      # The executable store is keyed by the compiler, and the spec jobs build on stable.
      - name: Merge the spec jobs' builds
        id: spec-stores
        if: needs.plan.outputs.site_in_docs == 'true'
        env:
          CLI: ${{ steps.soothfast.outputs.bin }}
        run: |
          shopt -s nullglob globstar
          for tar in "$RUNNER_TEMP"/spec-stores/**/store.tar; do
            dir=$(mktemp -d)
            tar -xf "$tar" -C "$dir"
            "$CLI" cache merge --from "$dir"
            rm -rf "$dir"
            hit=true
          done
          if [ "${hit:-}" = true ]; then
            rustup toolchain install stable --profile minimal
            echo "hit=true" >>"$GITHUB_OUTPUT"
          fi
      # Only this run's own legs. Several artifacts each land in a directory of
      # their own, and a lone one lands in the path itself.
      - name: Download this run's measurements
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soothfast-baseline-*
          path: ${{ runner.temp }}/baselines
      - name: Keep the latest attempt's measurements
        run: ./.soothfast-action/action/latest-attempt.sh "$RUNNER_TEMP/baselines"
      - name: Download the item listing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soothfast-plan
          path: ${{ runner.temp }}/plan
      - name: Check the docs
        env:
          SHARDS: ${{ inputs.shard }}
        run: |
          cargo soothfast ci docs --baselines "$RUNNER_TEMP/baselines" \
            --expect-shards "$SHARDS" --plan "$RUNNER_TEMP/plan/plan.json"
      # The site is built here because this job has the merged baseline, so
      # its pages carry the run's measured numbers. It builds even when the
      # docs check failed, so the verdict still gets a site result.
      - name: Install the pinned rustdoc toolchain for the site
        if: ${{ !cancelled() && needs.plan.outputs.site_in_docs == 'true' && needs.plan.outputs.docs_binds_rust == 'false' }}
        run: ./.soothfast-action/action/rustdoc-toolchain.sh
      # The built site carries the series, so the next run fetches it back from Pages.
      - name: Append the trend point
        if: >-
          needs.plan.outputs.trend_url != '' && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TREND_URL: ${{ needs.plan.outputs.trend_url }}
          CLI: ${{ steps.soothfast.outputs.bin }}
        run: ./.soothfast-action/action/trend-series.sh
      - name: Build the site
        if: ${{ !cancelled() && needs.plan.outputs.site_in_docs == 'true' }}
        env:
          SPEC_BUILDS: ${{ steps.spec-stores.outputs.hit }}
        run: |
          # The compiler and CARGO_INCREMENTAL the spec jobs built under, which the store keys name.
          if [ "$SPEC_BUILDS" = true ]; then
            export RUSTUP_TOOLCHAIN=stable CARGO_INCREMENTAL=0
          fi
          cargo soothfast ci site --out "$RUNNER_TEMP/soothfast-site"
      # pages.yml publishes this artifact.
      - name: Upload the site
        if: >-
          needs.plan.outputs.site_deploy == 'true' && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/soothfast-site
      - name: Upload the docs result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-docs-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  # One job per spec, proto, coverage, capture and site check the plan found
  # in soothfast.toml. Each is `cargo soothfast ci KIND`, so its flags and
  # packages come from the file.
  check:
    name: ${{ matrix.name }}
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.checks_any == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # History for the base a spec is gated against.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-${{ matrix.kind }}
      - uses: ./.soothfast-action/action/install
      - name: Install the pinned rustdoc toolchain
        if: matrix.rustdoc
        run: ./.soothfast-action/action/rustdoc-toolchain.sh
      # Entries are named for the toolchain, flags and sources they came from,
      # so a restored store only saves the builds whose inputs did not change.
      - name: Restore and save the rustdoc and executable stores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .soothfast/rustdoc
            .soothfast/bins
          key: soothfast-check-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            soothfast-check-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            soothfast-check-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.ref || github.ref_name }}-
            soothfast-check-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-
      - name: Check
        env:
          KIND: ${{ matrix.kind }}
          PACKAGE: ${{ matrix.package }}
        run: cargo soothfast ci "$KIND" ${PACKAGE:+-p "$PACKAGE"}
      # Both lanes are store hits after the check, so this only copies what
      # the site's routes pages read.
      - name: Stage the spec builds for the site
        if: ${{ !cancelled() && matrix.kind == 'spec' && needs.plan.outputs.site_in_docs == 'true' }}
        env:
          PACKAGE: ${{ matrix.package }}
          STAGE: ${{ runner.temp }}/store
        run: |
          for lane in routes rustdoc; do
            cargo soothfast ci build "$lane" --stage "$STAGE" ${PACKAGE:+--spec "$PACKAGE"} \
              || echo "::warning::could not stage the $lane builds for the site"
          done
          if [ -d "$STAGE" ]; then tar -C "$STAGE" -cf "$RUNNER_TEMP/store.tar" .; fi
      - name: Upload the spec builds
        if: ${{ !cancelled() && matrix.kind == 'spec' && needs.plan.outputs.site_in_docs == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-store-${{ matrix.name }}
          path: ${{ runner.temp }}/store.tar
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 1
      - name: Upload the check result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-result-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soothfast-results
          if-no-files-found: ignore

  verdict:
    name: verdict
    needs: [plan, test, test-projects, gate-rust, gate, docs, check]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The base branch, for gh to read the pull request from and for the
      # waiver label names its soothfast.toml configures.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
          sparse-checkout: soothfast.toml
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      # A pattern that matches nothing is not an error here: EXPECT turns a
      # missing result into an errored section.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: soothfast-result-*
          path: ${{ runner.temp }}/soothfast-results
      - name: Post the verdict
        env:
          CLI: ${{ steps.soothfast.outputs.bin }}
          RESULTS: ${{ runner.temp }}/soothfast-results
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          EXPECT_RUST: ${{ needs.plan.outputs.packages }}
          EXPECT_SHARDS: ${{ join(fromJSON(needs.plan.outputs.shards).include.*.shard, ' ') }}
          EXPECT_IMPORT: ${{ join(fromJSON(needs.plan.outputs.matrix).include.*.name, ' ') }}
          EXPECT_DOCS: ${{ needs.plan.outputs.docs == 'true' && 'docs' || '' }}
          EXPECT_TEST: ${{ needs.plan.outputs.test == 'true' && 'test-rust' || '' }} ${{ needs.plan.outputs.test_expect }}
          EXPECT_CHECK: ${{ needs.plan.outputs.checks_expect }}
        run: ./.soothfast-action/action/verdict.sh

  labels:
    name: Labels
    needs: plan
    if: inputs.bot && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ inputs.soothfast_ref }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
            Cargo.toml
          persist-credentials: false
      - id: soothfast
        uses: ./.soothfast-action/action/install
      - uses: ./.soothfast-action
        with:
          binary: ${{ steps.soothfast.outputs.bin }}
          gate: "false"
          changelog: "false"
          labels: "true"
