name: Spec

# Generated specs are committed by this workflow rather than by hand, so a
# contributor never has to remember to regenerate one. The compatibility gate
# runs on pull requests, where a breaking change can still be discussed.
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

env:
  # Package whose #[route] handlers declare the generated spec files. Add
  # further packages by extending both jobs' loops.
  SPEC_PKG: soothfast-spec

jobs:
  # Regenerate on the default branch and commit the result. Mirrors the
  # changelog job: same bot identity, same open-PR-and-self-merge pattern.
  generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: spec
      cancel-in-progress: true
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write # soothfast-bot token via the broker, see bot/
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Regenerate spec files
        run: cargo run --release -p cargo-soothfast -- spec gen -p "$SPEC_PKG"
      # Direct pushes to master are blocked by the branch ruleset, so the bot
      # opens a PR and squash-merges it itself instead.
      - name: Mint a soothfast-bot token
        id: bot
        run: action/bot-token.sh
      - name: Land the regenerated specs
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          BRANCH: bot/spec-update
          TITLE: "chore: regenerate API specs"
          BODY: Automated spec regeneration.
          PATHS: "*.yaml *.yml *.json"
        run: action/land.sh

  # On a PR, prove the committed specs are current and that the API change is
  # backwards compatible with the merge-base.
  gate:
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the gate measures the merge-base in a worktree
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Fails when a committed spec is stale, so the bot's output can never
      # silently diverge from the code it was generated from.
      - name: Specs are up to date
        run: cargo run --release -p cargo-soothfast -- spec gen -p "$SPEC_PKG" --check
      # Fails on changes that would break an existing consumer. Deliberate
      # breaks pass by adding --allow-breaking in a follow-up commit.
      - name: API is backwards compatible
        # base_ref reaches the shell through the environment, never through
        # `${{ }}` interpolation into the script itself.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cargo run --release -p cargo-soothfast -- \
            spec gate -p "$SPEC_PKG" --base "origin/$BASE_REF"
