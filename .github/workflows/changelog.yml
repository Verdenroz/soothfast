name: Changelog

# Regenerates on the PR branch itself, not after merging to master. The
# Performance section embeds freshly measured numbers, which drift slightly
# on every run even without a real regression, so a post-merge trigger would
# open a near-noise-only bot PR after almost every merge. Running here means
# the changelog is already correct by the time the PR lands, and the
# paths-ignore below stops the bot's own CHANGELOG-only commit from
# retriggering itself.
on:
  pull_request:
    paths-ignore: [CHANGELOG.md]

permissions: {}

jobs:
  changelog:
    # Fork PRs can't be pushed back to with the default token; skip them
    # rather than fail. Fine for a solo-maintainer repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the regenerated CHANGELOG.md onto the PR branch
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # This job pushes back to the PR branch with the default token (git
      # push below); persist-credentials must stay true here, unlike every
      # other workflow's read-only checkout.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # surface diff + previous-tag lookup need history
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make baselines
      # Every crate whose API ships, not just the facade: `soothfast` itself
      # re-exports, so its own surface is a fraction of what a reader needs.
      # `cargo-soothfast` is absent on purpose — a binary has no lib target
      # for rustdoc, and its `pub` items are nobody's dependency.
      # Before the first tag there is nothing to diff against, so the draft
      # lists the surface instead — `--against-ref HEAD` would compare HEAD
      # to itself and report "no public API changes" from no input at all.
      - name: Regenerate CHANGELOG.md
        env:
          PKGS: >-
            -p soothfast -p soothfast-macros -p soothfast-registry
            -p soothfast-measure -p soothfast-docs -p soothfast-spec
            -p soothfast-sdk -p soothfast-report -p soothfast-site
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          AGAINST=""
          [ -n "$PREV" ] && AGAINST="--against-ref $PREV"
          # shellcheck disable=SC2086 # both are deliberate flag lists
          cargo run --release -p cargo-soothfast -- \
            report changelog $PKGS --baseline self $AGAINST
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || { git commit -m "docs: regenerate CHANGELOG.md"; git push; }
