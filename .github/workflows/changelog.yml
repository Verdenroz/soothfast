name: Changelog

# Regenerates once per merge to master, not on every PR push

on:
  push:
    branches: [master]

permissions: {}

jobs:
  changelog:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    # Only the newest regeneration may land: an older one sees a stale tree.
    # A cancel between mint and land leaves its one-hour token unrevoked.
    concurrency:
      group: changelog
      cancel-in-progress: true
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write # soothfast-bot token via the broker, see bot/
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # surface diff + previous-tag lookup need history
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make baselines
      - name: Regenerate CHANGELOG.md
        env:
          PKGS: >-
            -p soothfast -p soothfast-macros -p soothfast-registry
            -p soothfast-measure -p soothfast-docs -p soothfast-spec
            -p soothfast-sdk -p soothfast-report -p soothfast-site
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          AGAINST=""
          [ -n "$PREV" ] && AGAINST="--against-ref $PREV"
          # shellcheck disable=SC2086 # both are deliberate flag lists
          cargo run --release -p cargo-soothfast -- \
            report changelog $PKGS --baseline self $AGAINST
      # Minted after the build so no step that compiles the tree holds it.
      - name: Mint a soothfast-bot token
        id: bot
        env:
          BROKER: https://soothfast-bot.verdenroz.workers.dev
        run: action/bot-token.sh
      - name: Land the regenerated changelog
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          BRANCH: bot/changelog-update
          TITLE: "docs: regenerate CHANGELOG.md"
          BODY: Automated CHANGELOG regeneration.
          PATHS: CHANGELOG.md
        run: action/land.sh
