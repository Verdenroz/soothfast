name: Changelog

on:
  pull_request:

permissions: {}

jobs:
  changelog:
    # pull_request paths-ignore diffs the whole PR vs base, not the latest
    # push, so skip bot actors instead to stop self-retriggering.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Mint a changelog-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # surface diff + previous-tag lookup need history
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make baselines
      - name: Regenerate CHANGELOG.md
        env:
          PKGS: >-
            -p soothfast -p soothfast-macros -p soothfast-registry
            -p soothfast-measure -p soothfast-docs -p soothfast-spec
            -p soothfast-sdk -p soothfast-report -p soothfast-site
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          AGAINST=""
          [ -n "$PREV" ] && AGAINST="--against-ref $PREV"
          # shellcheck disable=SC2086 # both are deliberate flag lists
          cargo run --release -p cargo-soothfast -- \
            report changelog $PKGS --baseline self $AGAINST
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || { git commit -m "docs: regenerate CHANGELOG.md"; git push; }
