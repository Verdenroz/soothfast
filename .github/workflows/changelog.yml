name: Changelog

on:
  push:
    branches: [master]

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit + push the regenerated CHANGELOG.md
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # This job pushes back with the default token at the end (git push
      # below); persist-credentials must stay true here, unlike every other
      # workflow's read-only checkout.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # surface diff + previous-tag lookup need history
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
      - run: rustup toolchain install nightly # rustdoc JSON
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - run: make baselines
      - name: Regenerate CHANGELOG.md
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          cargo run --release -p cargo-soothfast -- \
            report changelog -p soothfast --baseline self --against-ref "$PREV"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || { git commit -m "docs: regenerate CHANGELOG.md"; git push; }
