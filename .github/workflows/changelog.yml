name: Changelog

on:
  push:
    branches: [master]

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the regeneration branch + squash-merge the PR
      pull-requests: write # open and merge the regeneration PR
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # This job pushes a branch back with the default token (create-pull-request
      # below); persist-credentials must stay true here, unlike every other
      # workflow's read-only checkout.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # surface diff + previous-tag lookup need history
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make baselines
      # Every crate whose API ships, not just the facade: `soothfast` itself
      # re-exports, so its own surface is a fraction of what a reader needs.
      # `cargo-soothfast` is absent on purpose — a binary has no lib target
      # for rustdoc, and its `pub` items are nobody's dependency.
      # Before the first tag there is nothing to diff against, so the draft
      # lists the surface instead — `--against-ref HEAD` would compare HEAD
      # to itself and report "no public API changes" from no input at all.
      - name: Regenerate CHANGELOG.md
        env:
          PKGS: >-
            -p soothfast -p soothfast-macros -p soothfast-registry
            -p soothfast-measure -p soothfast-docs -p soothfast-spec
            -p soothfast-sdk -p soothfast-report -p soothfast-site
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          AGAINST=""
          [ -n "$PREV" ] && AGAINST="--against-ref $PREV"
          # shellcheck disable=SC2086 # both are deliberate flag lists
          cargo run --release -p cargo-soothfast -- \
            report changelog $PKGS --baseline self $AGAINST
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: CHANGELOG.md
          commit-message: "docs: regenerate CHANGELOG.md"
          title: "docs: regenerate CHANGELOG.md"
          body: Automated changelog regeneration.
          branch: bot/changelog-update
          delete-branch: true
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --squash --delete-branch "$PR_NUMBER"
