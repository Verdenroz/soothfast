name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Re-run weekly so newly disclosed advisories surface even without a push.
    - cron: "20 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  # Dependency supply-chain checks: advisories, banned crates, license policy,
  # and allowed sources (typosquat / dependency-confusion defense).
  cargo-deny:
    name: cargo-deny
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Static analysis of the GitHub Actions workflows themselves.
  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The action defaults to the latest zizmor, so a release that adds an
      # audit turns this job red on a day nothing here changed. Pin the tool
      # and bump it deliberately, the way the rustdoc nightly is pinned.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0

  # Syntax and expression checks that zizmor does not make, such as a context
  # used where GitHub does not provide it. The image is pinned by digest and
  # bumped deliberately; actionlint reads the workflows only, so the composite
  # actions are left to zizmor.
  actionlint:
    name: actionlint
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color=false
