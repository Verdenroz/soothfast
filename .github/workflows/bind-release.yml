name: Bind release

# Internal: called only by release.yml's `bind` job. Not a reusable workflow
# for other repos — adopters build native bindings through the root action's
# `bind-build`/`bind-target` inputs (see docs/ci.md).
#
# Python needs one runner per target — a wheel is a per-platform artifact,
# and glibc builds run inside the manylinux image so the tag they claim is
# one they have earned. Wasm needs no matrix at all: one `.wasm` runs
# everywhere, so it gets a single job.
on:
  workflow_call:
    inputs:
      package:
        description: Cargo package whose [[bind]] entries are built.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  python:
    name: python ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # digest pin pending: quay.io is unreachable from the authoring
      # environment; zizmor unpinned-images fires until it lands.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_17_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_17_aarch64
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      # harden-runner needs sudo on the runner and cannot audit a job that
      # is itself a container: https://github.com/step-security/harden-runner/blob/main/docs/limitations.md
      - if: ${{ !matrix.container }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Pin the rustdoc toolchain
        shell: bash
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bind-${{ matrix.target }}
      - run: cargo build --release --locked -p cargo-soothfast
      # manylinux images have no python or pip on PATH; every interpreter
      # lives under /opt/python/<tag>.
      - if: matrix.container
        shell: bash
        run: |
          /opt/python/cp312-cp312/bin/pip install maturin
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
      - if: ${{ !matrix.container }}
        run: pip install maturin
      - name: Locate the built CLI
        id: cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN=target/release/cargo-soothfast
          [ "$TARGET" = x86_64-pc-windows-msvc ] && BIN=target/release/cargo-soothfast.exe
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
      - name: Write the glue crate
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          CLI: ${{ steps.cli.outputs.bin }}
        run: $CLI bind gen -p "$PACKAGE"
      - uses: ./
        with:
          bind-build: ${{ inputs.package }}
          bind-target: ${{ matrix.target }}
          binary: ${{ steps.cli.outputs.bin }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bind-python-${{ matrix.target }}
          path: "**/target/wheels/*.whl"
          if-no-files-found: ignore

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Pin the rustdoc toolchain
        run: |
          TC=$(make -s print-SOOTHFAST_RUSTDOC_TOOLCHAIN)
          echo "SOOTHFAST_RUSTDOC_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustup toolchain install "$TC"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bind-wasm
      - run: cargo build --release --locked -p cargo-soothfast
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Write the glue crate
        env:
          PACKAGE: ${{ inputs.package }}
        run: target/release/cargo-soothfast bind gen -p "$PACKAGE"
      - uses: ./
        with:
          bind-build: ${{ inputs.package }}
          binary: target/release/cargo-soothfast
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bind-wasm
          path: "**/pkg/*"
          if-no-files-found: ignore
