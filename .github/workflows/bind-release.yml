name: Bind release

# Reusable: a consumer crate calls this to build its native language
# bindings and upload them.
#
# Python needs one runner per target — a wheel is a per-platform artifact,
# and glibc builds run inside the manylinux image so the tag they claim is
# one they have earned. Wasm needs no matrix at all: one `.wasm` runs
# everywhere, so it gets a single job.
on:
  workflow_call:
    inputs:
      package:
        description: Cargo package whose [[bind]] entries are built.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  python:
    name: python ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: quay.io/pypa/manylinux_2_17_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: quay.io/pypa/manylinux_2_17_aarch64
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: rustup toolchain install nightly # rustdoc JSON
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bind-${{ matrix.target }}

      # A manylinux_2_17 tag is a claim about glibc at link time, so the
      # glibc targets build in the image that makes it true.
      # Expansions go through the environment, never into the shell text:
      # a package name is workflow input, and `run:` interpolation would
      # make it executable. (zizmor: template-injection)
      - name: Build (manylinux)
        if: matrix.manylinux
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.manylinux }}
        run: |
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e CARGO_TERM_COLOR -e PACKAGE -e TARGET \
            "$IMAGE" \
            bash -c '
              set -euo pipefail
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              rustup toolchain install nightly # rustdoc JSON
              pip install maturin
              cargo run --release -p cargo-soothfast -- \
                bind gen -p "$PACKAGE"
              cargo run --release -p cargo-soothfast -- \
                bind build -p "$PACKAGE" --target "$TARGET"
            '

      - name: Build
        if: ${{ !matrix.manylinux }}
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
        run: |
          pip install maturin
          cargo run --release -p cargo-soothfast -- bind gen -p "$PACKAGE"
          cargo run --release -p cargo-soothfast -- bind build -p "$PACKAGE" --target "$TARGET"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bind-python-${{ matrix.target }}
          path: "**/target/wheels/*.whl"
          if-no-files-found: ignore

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: rustup toolchain install nightly # rustdoc JSON
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bind-wasm

      - name: Build
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          cargo run --release -p cargo-soothfast -- bind gen -p "$PACKAGE"
          cargo run --release -p cargo-soothfast -- bind build -p "$PACKAGE"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bind-wasm
          path: "**/pkg/*"
          if-no-files-found: ignore
