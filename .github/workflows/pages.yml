name: soothfast-pages

# Publishes the Pages artifact the docs job of run.yml uploaded earlier in
# the same run. A caller invokes it only when `[ci] pages = true`, so no
# other caller has to grant `pages: write`. `cargo soothfast init` writes
# the call.
on:
  workflow_call:

permissions: {}

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
