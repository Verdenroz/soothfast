name: soothfast-gate

on:
  workflow_call:
    inputs:
      package:
        description: "Cargo package with the soothfast bench target"
        required: true
        type: string
      base-ref:
        description: "Git ref to gate against (defaults to the PR base)"
        required: false
        type: string
        default: ""
      cli-artifact:
        description: >-
          Artifact holding a prebuilt cargo-soothfast at bin/cargo-soothfast.
          Empty installs the release matching the caller's Cargo.lock.
        required: false
        type: string
        default: ""
    secrets:
      # Unused. Declared so callers that still pass it keep validating.
      CHANGELOG_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write # fallback for the comment when no bot token
      id-token: write # the broker posts the gate comment as soothfast-bot
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # merge-base needs history
      # The action scripts at this workflow's own commit, whoever calls it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Verdenroz/soothfast
          ref: ${{ github.job_workflow_sha }}
          path: .soothfast-action
          sparse-checkout: |
            action
            action.yml
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # callgrind fallback + triage artifacts for PMU-less runners
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - if: inputs.cli-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.cli-artifact }}
          path: bin
      - if: inputs.cli-artifact != ''
        run: chmod +x bin/cargo-soothfast
      - if: inputs.cli-artifact == ''
        uses: ./.soothfast-action
        with:
          gate: "false"
          changelog: "false"
      - name: Run gate
        id: gate
        run: |
          REF="${INPUTS_BASE_REF}"
          if [ -z "$REF" ]; then REF="origin/${GITHUB_BASE_REF:-master}"; fi
          if [ -x bin/cargo-soothfast ]; then set -- bin/cargo-soothfast; else set -- cargo soothfast; fi
          "$@" gate -p "${INPUTS_PACKAGE}" --against-ref "$REF" | tee gate-output.txt
        env:
          INPUTS_BASE_REF: ${{ inputs.base-ref }}
          INPUTS_PACKAGE: ${{ inputs.package }}
      - name: Upload triage artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-triage
          path: .soothfast/triage/
          if-no-files-found: ignore
      # The broker posts the comment as soothfast-bot; a fork pull request has
      # no OIDC token and falls back to github.token. Best effort either way.
      - name: PR comment with gate results
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- soothfast-gate -->"
          BODY_FILE: ${{ runner.temp }}/soothfast-gate-comment.md
        run: |
          {
            echo '## soothfast gate'
            echo '```'
            tail -n 60 gate-output.txt | sed 's/```/` ` `/g'
            echo '```'
          } > "$BODY_FILE"
          .soothfast-action/action/comment.sh
