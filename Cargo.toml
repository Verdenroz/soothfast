[workspace]
resolver = "3"
members = [
    "soothfast",
    "soothfast-macros",
    "soothfast-registry",
    "soothfast-measure",
    "soothfast-docs",
    "soothfast-spec",
    "soothfast-sdk",
    "soothfast-report",
    "soothfast-site",
    "cargo-soothfast",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Harvey Tseng <harveytseng2@gmail.com>"]
repository = "https://github.com/Verdenroz/soothfast"
readme = "README.md"
keywords = ["benchmark", "performance", "documentation", "regression", "gate"]
categories = ["development-tools", "development-tools::profiling", "development-tools::testing"]

[workspace.dependencies]
# `version` alongside `path` lets `cargo publish` resolve intra-workspace deps.
soothfast-macros = { path = "soothfast-macros", version = "0.1.7" }
soothfast-registry = { path = "soothfast-registry", version = "0.1.7" }
soothfast-measure = { path = "soothfast-measure", version = "0.1.7" }
soothfast-docs = { path = "soothfast-docs", version = "0.1.7" }
soothfast-spec = { path = "soothfast-spec", version = "0.1.7" }
soothfast-sdk = { path = "soothfast-sdk", version = "0.1.7" }
soothfast-report = { path = "soothfast-report", version = "0.1.7" }
soothfast-site = { path = "soothfast-site", version = "0.1.7" }
serde_json = "1"
linkme = "=0.3.36"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
