repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

  # General hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # 1000 KB cap: valgrind core dumps and similar debris never get committed.
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
      # llms.txt is generated by `report render`, which ends it with a blank
      # line; stripping that makes `make llms-gate` see the committed copy as
      # stale against a fresh render.
      - id: end-of-file-fixer
        exclude: '^llms\.txt$'
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']
